openapi: 3.1.0
info:
  title: TrackLin.es API
  version: 1.0.0
  description: |
    Complete HTTP API for projects, boards, tickets, roadmaps, billing, and
    integrations. The API also supports the BugFixes workflow: create in a
    board column or project backlog, append conversation updates, and close a
    board ticket by moving it to the board's last (Done) column.

    API-key requests are rate limited per key (default 300 a minute, set with
    API_KEY_RATE_LIMIT): over the limit answers 429 with Retry-After, and every
    response carries X-RateLimit-Limit / X-RateLimit-Remaining. MCP tool calls
    count like the REST calls they make. Browser sessions aren't limited.

    Most private endpoints accept a Clerk session token or a TrackLin.es (`tl_ai_…` for AI agents, `tl_s_…` for services, `tl_p_…` for personal keys; older keys are `tl_…`)
    or BugFixes (`bf_…`) agent API key as a Bearer token. Projects, boards and
    roadmaps belong to a Clerk organization: a session sees its active
    organization's data, and a request without an active organization gets
    403. API keys act inside the organization they were created in, as their
    creator, and attribute writes to the key's name; a personal key is its creator, so
    its writes are theirs. A read-only key gets 403 for anything but GET. API-key management
    requires a Clerk session. Stripe webhooks use Stripe-Signature.

    Timestamps are stored and returned in UTC. Day-based rules (a sprint's last
    day) use the caller's timezone from the optional `Tracklines-Timezone`
    header (an IANA name such as Europe/London); without it, or for an unknown
    zone, UTC.

    On a sprint's last day (in that timezone, or once ends_at has passed) its
    scope is locked: moving a ticket into it answers 409, and a ticket created
    in one of its board's columns goes to the bottom of the project backlog
    instead (the 201 body has `redirected_to_backlog: true`).
    IDs are UUIDs. Error responses are plain-text messages.
servers:
  - url: https://api.tracklin.es/api
    description: Production backend API
  - url: http://localhost:8080/api
    description: Local API
security:
  - bearerAuth: []
tags:
  - name: Contact
    description: The public contact form; messages go to the TrackLin.es team.
  - name: Projects
    description: Create, list, inspect, update, and delete projects.
  - name: Organizations
    description: Inspect membership in the active Clerk organization.
  - name: Teams
    description: Manage role-free teams, team membership, and project links inside the active organization.
  - name: Tickets
    description: Create, inspect, move, and close tickets.
  - name: Comments
    description: Append updates to a ticket conversation.
  - name: Boards
    description: Team boards and columns.
  - name: Columns
    description: Board workflow columns.
  - name: Attachments
    description: UploadThing attachment metadata.
  - name: Sprints
    description: Board sprints.
  - name: Live
    description: Hosted standups and refinements that people join and follow.
  - name: Roadmaps
    description: Project roadmaps and linked ticket progress.
  - name: API keys
    description: Manage AI agent and server/service API keys with a Clerk session.
  - name: Billing
    description: Stripe subscription and webhook operations.
  - name: System
    description: Health check.
paths:
  /organizations/members:
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      summary: List active organization members
      description: Returns role-free member details for the caller's active organization. Results are paginated.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of active organization members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationMemberPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No active organization in the caller's session or API key. }
        '502': { description: The identity provider could not return organization membership. }
  /board-templates:
    get:
      tags: [Boards]
      operationId: listBoardTemplates
      summary: Board templates (built-ins, then the organization's own)
      responses:
        '200': { description: Templates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BoardTemplate' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Boards]
      operationId: createBoardTemplate
      summary: Save an organization board template
      description: Org admins only, signed in with a Clerk session. Send a full template, or {name, from_board_id} to copy an existing board's columns, WIP limits, style and estimate scale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                from_board_id: { type: string, format: uuid }
                style: { type: string, enum: [sprints, kanban] }
                estimate_scale: { $ref: '#/components/schemas/EstimateScale' }
                columns: { $ref: '#/components/schemas/BoardTemplate/properties/columns' }
      responses:
        '201': { description: Template saved., content: { application/json: { schema: { $ref: '#/components/schemas/BoardTemplate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
  /board-templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Boards]
      operationId: deleteBoardTemplate
      summary: Delete an organization template (built-ins can't be deleted)
      responses:
        '204': { description: Deleted. }
        '400': { description: Built-in templates can't be deleted. }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
  /mcp:
    post:
      tags: [MCP]
      operationId: mcp
      summary: Model Context Protocol endpoint for bots
      description: >-
        MCP over Streamable HTTP (stateless; responses are application/json). Send JSON-RPC MCP messages
        (initialize, tools/list, tools/call). Authenticate like the REST API (tl_ API key or Clerk session).
        Each tool calls the matching REST route with the caller's credentials, so results, permissions and
        errors are the same as REST; a failed call is a tool result with isError and the REST status in its text.
        GET and DELETE return 405 (no sessions or server-initiated streams).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A JSON-RPC 2.0 MCP message. }
      responses:
        '200': { description: JSON-RPC response., content: { application/json: { schema: { type: object } } } }
        '202': { description: Notification accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizations/me:
    get:
      tags: [Organizations]
      operationId: getMyOrganizationRoles
      summary: The caller's roles in their active organization
      responses:
        '200':
          description: Whether the caller is an org admin, and the teams they lead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  org_id: { type: string }
                  admin: { type: boolean }
                  leads: { type: array, items: { type: string, format: uuid } }
        '403': { description: No active organization. }
        '502': { description: Clerk could not be reached to resolve the first admin. }
  /organizations/admins:
    get:
      tags: [Organizations]
      operationId: listOrganizationAdmins
      summary: List the organization's TrackLin.es admins
      description: >-
        Organizations and their members live in Clerk; TrackLin.es only records which members are admins.
        The first time an org's admins are needed, one is chosen from Clerk and stored: the user who created
        the organization if they are still a member, otherwise the longest-standing member with the Clerk
        org:admin role, otherwise the longest-standing member. granted_by records which rule applied
        (clerk:creator, clerk:admin-role, clerk:earliest-member) or the admin who granted it. If Clerk can't be
        reached nothing is stored and the next request tries again (502); an organization with no members gets
        no admin (409).
      responses:
        '200': { description: Admins oldest first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrgAdmin' } } } } }
        '403': { description: No active organization. }
        '409': { description: The organization has no members to make admin. }
        '502': { description: Clerk could not be reached. }
  /organizations/admins/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Organizations]
      operationId: grantOrganizationAdmin
      summary: Make an organization member an admin
      description: Org admins only, signed in with a Clerk session (API keys are refused). The user must be a Clerk member of the organization.
      responses:
        '204': { description: Granted (or already an admin). }
        '403': { description: Not a signed-in org admin. }
        '422': { description: The user is not a member of this organization. }
    delete:
      tags: [Organizations]
      operationId: revokeOrganizationAdmin
      summary: Remove an admin
      description: Org admins only, signed in with a Clerk session. The last admin can't be removed.
      responses:
        '204': { description: Removed. }
        '403': { description: Not a signed-in org admin. }
        '409': { description: That is the organization's last admin. }
  /invitations:
    get:
      tags: [Organizations]
      operationId: listMyInvitations
      summary: List pending invitations sent to the caller
      description: Uses the caller's verified Clerk email addresses and does not require an active organization.
      responses:
        '200':
          description: Pending invitations addressed to the caller.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: API keys cannot inspect or accept invitations. }
        '502': { description: Clerk could not load the caller's verified email addresses. }
  /organizations/invitations:
    get:
      tags: [Organizations]
      operationId: listOrganizationInvitations
      summary: List invitations created for the active organization
      description: Org admins only. Pending, accepted, and revoked TrackLin.es invitations are returned newest first; expired pending invitations are reported as expired.
      responses:
        '200':
          description: Organization invitations.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin. }
    post:
      tags: [Organizations]
      operationId: createOrganizationInvitation
      summary: Invite an email address to an organization, team, or project
      description: >-
        Org admins only. Clerk sends an organization invitation with the org:member role. For team or project
        scope, the recipient must accept through Clerk and then call the accept operation below with a signed-in
        session using the invited, verified email address. Team invites create ordinary team membership; project
        invites create project membership. Organization members retain read access to all organization projects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '402': { description: "The plan's member limit is reached (Free and Pro: 20, counting invitations not yet accepted); upgrade to Enterprise." }
        '201':
          description: Invitation created. accept_url is the Clerk-hosted invitation link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The email address is already an organization member. }
        '502': { description: Clerk could not create or validate the invitation. }
  /organizations/invitations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Organizations]
      operationId: getOrganizationInvitation
      summary: Inspect an organization invitation
      responses:
        '200':
          description: Invitation details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Organizations]
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending invitation
      responses:
        '204': { description: Invitation revoked in Clerk and TrackLin.es. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Only pending invitations can be revoked. }
        '502': { description: Clerk could not revoke the invitation. }
  /organizations/invitations/{id}/accept:
    post:
      tags: [Organizations]
      operationId: acceptOrganizationInvitation
      summary: Complete an accepted Clerk invitation in TrackLin.es
      description: >-
        The invitee must first accept the Clerk invitation. This endpoint then verifies the Clerk invitation,
        active organization membership, and a verified matching email. Team and project invitations create the
        corresponding local membership; team invitations never assign team leader authority. API keys are refused.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Invitation accepted and local membership applied. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The caller is an API key or does not own the invited verified email address. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Clerk invitation or organization membership is not accepted yet. }
        '410': { description: "Invitation expired, revoked, or already accepted by another user." }
        '502': { description: Clerk could not verify the invitation or recipient. }
  /teams/{teamId}/leaders/{userId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Teams]
      operationId: addTeamLeader
      summary: Make a team member a leader
      description: Org admins only, signed in with a Clerk session. A team can have several leaders; leaders must be on the team, and removing them from the team ends their leadership.
      responses:
        '204': { description: They now lead the team. }
        '403': { description: Not a signed-in org admin. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The user is not on the team. }
    delete:
      tags: [Teams]
      operationId: removeTeamLeader
      summary: Stop a member leading the team (they stay on it)
      responses:
        '204': { description: No longer a leader. }
        '403': { description: Not a signed-in org admin. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The user is not on the team. }
  /boards/{boardId}/team:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    put:
      tags: [Teams]
      operationId: setBoardTeam
      summary: Set the team that runs a board
      description: >-
        Org admins only, signed in with a Clerk session. The team's leaders' authority is scoped to the boards it
        runs. The team must belong to the organization and already be linked to the board's project; removing
        the team from the project unlinks it from that project's boards. null unlinks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id]
              properties:
                team_id: { type: [string, 'null'], format: uuid }
      responses:
        '204': { description: Board updated. }
        '403': { description: Not a signed-in org admin. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The team isn't linked to the board's project. }
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: List teams in the active organization
      responses:
        '200': { description: Teams, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Team' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No active organization. }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201': { description: Team created, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Requires a signed-in organization admin. }
  /teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Update a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '204': { description: Team updated. }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Delete a team
      responses:
        '204': { description: Team and its memberships deleted. }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/members:
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: List team members and which of them lead the team
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Team members, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamMember' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{teamId}/members/{userId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Teams]
      operationId: addTeamMember
      summary: Add an active organization member to a team
      responses:
        '204': { description: Membership recorded. }
        '403': { description: Requires a signed-in organization admin. }
        '422': { description: User is not an active member of the organization. }
        '502': { description: Could not verify membership with the identity provider. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: Remove a member from a team
      responses:
        '204': { description: Membership removed. }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/teams:
    get:
      tags: [Teams]
      operationId: listProjectTeams
      summary: List teams linked to a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Project teams, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Team' } } } } }
  /projects/{projectId}/teams/{teamId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: teamId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Teams]
      operationId: addProjectTeam
      summary: Link a same-organization team to a project
      responses:
        '204': { description: Team linked. }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      operationId: removeProjectTeam
      summary: Unlink a team from a project
      responses:
        '204': { description: Team unlinked. }
        '403': { description: Requires a signed-in organization admin. }
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects accessible to this agent
      description: Use a project's ID when creating a ticket directly in its backlog.
      responses:
        '200':
          description: Projects owned by the API key's owner.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '402':
          description: Free plan project limit reached.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project with its boards and roadmaps
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: key_prefix (optional) renames every ticket key in the project (TL-123 → TRK-123); only organization admins can change it. Use 2–6 capital letters or digits starting with a letter; 409 if another project in the org uses it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '204': { description: Project updated. }
        '403': { description: Changing key_prefix requires an organization admin session. }
        '409': { description: key_prefix is used by another project in the organization. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Permanently delete a project and its boards, tickets, roadmaps, repos, and intake
      description: This action cannot be undone and permanently deletes all work under the project. Organization admin session required.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Project deleted. }
        '403': { description: Organization admin session required. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/boards:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Boards]
      operationId: createBoard
      summary: Create a team board, optionally from a template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardInput' }
      responses:
        '201':
          description: Board created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Board' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/backlog:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tickets]
      operationId: listBacklog
      summary: List a project's backlog
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [bug, feature, task, epic] }
      responses:
        '200':
          description: Backlog tickets, ordered by position.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tickets]
      operationId: createBacklogTicket
      summary: Create a ticket directly in a project's backlog
      description: Creates a ticket without requiring a board or column. The ticket is attributed to the API key's agent name and defaults to type `task` if `type` is omitted.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBacklogTicket'
            example:
              type: bug
              title: Project creation returns an error
              description: Creating a project from the dashboard returns HTTP 403.
      responses:
        '201':
          description: Backlog ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /boards/{boardId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      operationId: getBoard
      summary: Get board columns and tickets
      description: Use the column with the greatest `position` as the Done column when closing a ticket.
      responses:
        '200':
          description: Board, with ordered columns and their current tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Boards]
      operationId: updateBoard
      summary: Rename a board or change its settings
      description: >-
        Provide any of name, estimate_scale and style. Changing estimate_scale clears the estimates of tickets on the
        board, except those in closed sprints (kept for velocity history). Switching to kanban ends the open sprint, if
        any: it closes with no successor, keeps its done tickets, and its unfinished tickets stay on the board outside
        any sprint. Kanban boards can't start sprints and show only Done tickets finished in the last 14 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1 }
                estimate_scale: { $ref: '#/components/schemas/EstimateScale' }
                style: { type: string, enum: [sprints, kanban] }
                agent_review: { type: boolean, description: "Agents' moves into Done wait for a person's review." }
      responses:
        '204': { description: Board updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boards]
      operationId: deleteBoard
      summary: Delete a board
      responses:
        '204': { description: Board deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin. }
        '404': { $ref: '#/components/responses/NotFound' }

  /boards/{boardId}/columns:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    put:
      tags: [Columns]
      operationId: setColumnLayout
      summary: Set a board's whole column layout at once
      description: >-
        The edit board page's save. Columns in order, each an existing column (id) or a new one (no id), with its
        name and WIP limit. The first (To do) and last (Done) stay first and last, and take no WIP limit. Columns
        left out are deleted, refused (409) while they hold tickets in the current sprint. All or nothing. Board
        managers only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns]
              properties:
                columns:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [name]
                    properties:
                      id: { type: string, format: uuid, description: Left out for a new column. }
                      name: { type: string, maxLength: 80 }
                      wip_limit: { type: integer, minimum: 0, maximum: 999, nullable: true, description: 0 or null for none. }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Only organization admins and the board's team leaders can change its columns. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A column left out still has tickets in the current sprint. }
    post:
      tags: [Columns]
      operationId: createColumn
      summary: Add a column to a board
      description: The new column goes just before the last column (Done), which stays last. A ticket is done when it's in the board's last column.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameInput' }
      responses:
        '201':
          description: Column created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Column' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }

  /boards/{boardId}/columns/order:
    put:
      tags: [Columns]
      operationId: reorderColumns
      summary: Replace a board's column order
      description: Every column exactly once, with the last column (Done) still last; moving it is a 400, since a ticket is done when it's in the last column.
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column_ids]
              properties:
                column_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Column order updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }

  /columns/{columnId}:
    parameters:
      - name: columnId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Columns]
      operationId: updateColumn
      summary: Rename a column and/or set its work-in-progress limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1 }
                wip_limit: { type: integer, minimum: 0, maximum: 999, description: "Advisory; moves over the limit still go through. 0 removes it." }
      responses:
        '204': { description: Column updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Columns]
      operationId: deleteColumn
      summary: Delete an empty column
      responses:
        '204': { description: Column deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Column still contains tickets. }

  /columns/{columnId}/tickets:
    post:
      tags: [Tickets]
      operationId: createBoardTicket
      summary: Create a ticket in a board column
      description: >-
        The ticket joins the board's open sprint. On that sprint's last day it goes to the bottom of the project
        backlog instead: still 201, with `column_id` null, `redirected_to_backlog: true`, and any estimate dropped.
      parameters:
        - name: columnId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketInput' }
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Ticket'
                  - type: object
                    properties:
                      redirected_to_backlog: { type: boolean, description: Present (true) when the sprint was locked and the ticket went to the backlog. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /search:
    get:
      tags: [Tickets]
      operationId: searchTickets
      summary: Search the organization's tickets
      description: >-
        Full-text over titles (weighted highest), descriptions and comments. Every word must match, as a prefix, so it works while
        typing; punctuation is ignored. A ticket key in q (TL-123, case-insensitive) returns just that ticket. Ranked by relevance,
        then most recently changed. Without q it lists by recent change, filtered. The MCP tool search_tickets maps to this.
      parameters:
        - { name: epic, in: query, schema: { type: string, format: uuid }, description: "Only this epic's sub-tickets, at any depth." }
        - { name: q, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string, format: uuid } }
        - { name: board, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: array, items: { type: string, enum: [bug, feature, task, epic] } }, style: form, explode: true, description: Any of. }
        - { name: priority, in: query, schema: { type: array, items: { type: string, enum: [low, medium, high, urgent] } }, style: form, explode: true, description: Any of. }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true, description: Any of (case-insensitive). }
        - { name: assignee, in: query, schema: { type: string }, description: "me (the caller), unassigned, or a user id / agent name." }
        - { name: status, in: query, schema: { type: string, enum: [open, done] } }
        - { name: match, in: query, description: 'any: a ticket matching any word (of three letters or more) will do, most matches first, for spotting duplicates despite typos. Default: every word must match.', schema: { type: string, enum: [any] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 }, description: '1-based, with limit. "My work" is assignee=me&status=open across every board and project.' }
      responses:
        '200':
          description: Matching tickets, best first.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Ticket'
                    - type: object
                      properties:
                        project_name: { type: string }
                        board_id: { type: [string, 'null'], format: uuid, description: Null in the backlog. }
                        board_name: { type: [string, 'null'] }
                        column_name: { type: [string, 'null'] }
                        done: { type: boolean }
                        snippet: { type: string, description: Where the words matched in the description or a comment; empty when only the title matched. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{ticketId}/bugfixes:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      operationId: getTicketBugfixes
      summary: The Bugfixes panel for a ticket Bugfixes created
      description: >-
        The linked crash report's live details, fetched server-side with the org's Bugfixes connection and cached for a
        minute. regressed is true when the report is open and was seen after the ticket was done. When the org hasn't
        connected Bugfixes (reason not_connected) or Bugfixes can't be reached (unavailable), available is false but the
        link is still returned.
      responses:
        '200':
          description: The panel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string, enum: [bugfixes] }
                  project: { type: string }
                  report_id: { type: string }
                  url: { type: string }
                  available: { type: boolean }
                  reason: { type: string, enum: [not_connected, unavailable] }
                  regressed: { type: boolean }
                  report:
                    type: object
                    properties:
                      title: { type: string }
                      occurrences: { type: integer }
                      status: { type: string, enum: [open, resolved, ignored] }
                      last_seen: { type: string, format: date-time }
                      levels: { type: array, items: { type: string } }
                      file: { type: string }
                      line: { type: integer }
        '404': { description: The ticket didn't come from Bugfixes. }

  /intake/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: The project's unlisted form link token. }
    get:
      tags: [Intake]
      operationId: intakeForm
      summary: Whether a request form link is open (public, no account)
      description: Says nothing else about the project.
      security: []
      responses:
        '200': { description: Open., content: { application/json: { schema: { type: object, properties: { open: { type: boolean } } } } } }
        '404': { description: Closed or unknown link. }
    post:
      tags: [Intake]
      operationId: intakeSubmit
      summary: Send a bug report or feature request through a project's form (public, no account)
      description: >-
        Held for the team to triage; never put on a board. Limits: 5 per sender per hour, 200 per project per day.
        A filled-in website field (hidden from people) marks a bot: accepted and dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type: { type: string, enum: [bug, feature] }
                title: { type: string, maxLength: 200 }
                details: { type: string, maxLength: 5000 }
                contact: { type: string, maxLength: 200, description: Optional, e.g. an email; seen by the team only. }
                website: { type: string, description: Honeypot; leave empty. }
      responses:
        '202': { description: Received. }
        '400': { description: Invalid request. }
        '404': { description: Closed or unknown link. }
        '429': { description: Too many requests from this sender. }
  /projects/{projectId}/intake:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Intake]
      operationId: intakeSettings
      summary: The project's request form, open (with its link token) or closed
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/IntakeSettings' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Intake]
      operationId: setIntake
      summary: Open or close the request form; rotate replaces the link (the old one stops working)
      description: Org admins only, in a signed-in session. API keys get 403, even an admin's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [open], properties: { open: { type: boolean }, rotate: { type: boolean } } }
      responses:
        '200': { description: Settings., content: { application/json: { schema: { $ref: '#/components/schemas/IntakeSettings' } } } }
        '403': { description: Not a signed-in org admin. }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/intake/submissions:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Intake]
      operationId: listIntakeSubmissions
      summary: Requests sent through the form, newest first (pending by default)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, promoted, dismissed], default: pending } }
      responses:
        '200': { description: Submissions., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IntakeSubmission' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /intake-submissions/{submissionId}/promote:
    parameters:
      - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Intake]
      operationId: promoteIntakeSubmission
      summary: Turn a pending request into an unassigned backlog ticket
      responses:
        '200': { description: Promoted, with its ticket., content: { application/json: { schema: { $ref: '#/components/schemas/IntakeSubmission' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already triaged. }
  /intake-submissions/{submissionId}/dismiss:
    parameters:
      - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Intake]
      operationId: dismissIntakeSubmission
      summary: Close a pending request without making a ticket
      responses:
        '204': { description: Dismissed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already triaged. }
  /boards/{boardId}/archive:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Boards]
      operationId: archiveBoard
      summary: Archive a used board (board managers)
      description: >-
        Takes it off the project's boards; its history stays. Refused (409) while it has unfinished tickets.
        Its open sprint closes with no next sprint (finished tickets stay with it for velocity); its planned
        sprints are dropped and their tickets go back to the backlog unplanned. No tickets can be added to or
        moved onto an archived board (409).
      responses:
        '204': { description: Archived. }
        '403': { description: Not an org admin or this board's team leader. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: It still has unfinished tickets. }
  /boards/{boardId}/restore:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Boards]
      operationId: restoreBoard
      summary: Put an archived board back on its project (board managers)
      responses:
        '204': { description: Restored. }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/archived-boards:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Boards]
      operationId: listArchivedBoards
      summary: A project's archived boards, most recently archived first
      responses:
        '200': { description: Boards., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Board' } } } } }
  /me/google-chat:
    get:
      tags: [Notifications]
      operationId: getGoogleChatLink
      summary: Whether your Google Chat is linked for personal messages
      description: The TrackLin.es Google Chat app sends your own notifications (assigned, mentioned, review…) to your chat with it, once you've linked your account from the link it sends you.
      responses:
        '200':
          description: available is false when the server has no Chat app.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  linked: { type: boolean }
                  linked_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Notifications]
      operationId: unlinkGoogleChat
      summary: Stop personal messages in Google Chat
      responses:
        '204': { description: Unlinked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/google-chat/link:
    post:
      tags: [Notifications]
      operationId: linkGoogleChat
      summary: Link your Google Chat with the one-time code the Chat app sent you
      description: Signed-in sessions only (not API keys). Linking again replaces the earlier link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: Linked; the app confirms in Google Chat. }
        '400': { description: The code expired (30 minutes) or was already used. }
        '403': { description: Not a signed-in session. }
        '503': { description: The Chat app isn't set up on this server. }

  /webhooks/google-chat:
    post:
      tags: [Notifications]
      operationId: googleChatEvents
      summary: Requests from the TrackLin.es Google Chat app (Google only)
      description: Signed by Google for this endpoint (Authorization Bearer ID token); anything else is refused.
      security: []
      responses:
        '200': { description: The app's reply. }
        '401': { description: Not a request from Google Chat for this app. }
        '503': { description: The Chat app isn't set up on this server. }

  /push:
    get:
      tags: [Notifications]
      operationId: pushKey
      summary: Whether this server sends Web Push, and the VAPID public key browsers subscribe with
      responses:
        '200': { description: Push settings., content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, public_key: { type: string } } } } } }
  /push/subscriptions:
    post:
      tags: [Notifications]
      operationId: subscribePush
      summary: Turn on notifications for this device (signed-in people only)
      description: >-
        The browser's PushSubscription. The endpoint must be https on a known push service (Google, Mozilla,
        Apple, Microsoft): the server sends to it. The same browser subscribing again takes the row over.
        The device then gets every notification from the inbox, even with TrackLin.es closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [endpoint, keys], properties: { endpoint: { type: string, format: uri }, keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } } } }
      responses:
        '204': { description: Subscribed. }
        '400': { description: Not a browser push subscription. }
        '403': { description: API keys can't subscribe devices. }
        '503': { description: Push isn't set up on this server. }
    delete:
      tags: [Notifications]
      operationId: unsubscribePush
      summary: Turn off notifications for this device
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } }
      responses:
        '204': { description: Unsubscribed (your own devices only). }
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: The signed-in user's inbox in the active organization, unread first, then newest
      description: >-
        Events: assigned (someone assigned you a ticket), mention (@you in a comment), finished (a ticket you raised
        was finished or resolved), wont_do (a ticket you raised was closed as won't do, with the reason), review (an
        agent finished a ticket on a board you manage), sent_back (your ticket was sent back from review), approval
        (a planned sprint on a board you manage went over capacity). Nobody is told about their own actions; only
        people (not agents) get notifications. MCP tool list_notifications.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Notifications., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
        '403': { description: Not signed in to an organization. }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: unreadNotificationCount
      summary: How many notifications are unread
      responses:
        '200': { description: The count., content: { application/json: { schema: { type: object, properties: { count: { type: integer } } } } } }
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: readNotification
      summary: Mark one of your notifications read
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Read. }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/{notificationId}:
    delete:
      tags: [Notifications]
      operationId: dismissNotification
      summary: Remove one of your notifications
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read:
    delete:
      tags: [Notifications]
      operationId: clearReadNotifications
      summary: Remove all your notifications that are already read
      responses:
        '204': { description: Cleared. }
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: readAllNotifications
      summary: Mark all your notifications read
      responses:
        '204': { description: Read. }

  /tickets/{ticketId}/review:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      operationId: reviewTicket
      summary: Approve an agent's finished ticket (to Done) or send it back (to the first column)
      description: People only. The comment, if given, is added to the ticket by the reviewer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [approve], properties: { approve: { type: boolean }, comment: { type: string, maxLength: 10000 } } }
      responses:
        '204': { description: Reviewed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Agents (API keys) can't review. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The ticket isn't waiting for review. }

  /tickets/{ticketId}/external:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    put:
      tags: [Tickets]
      operationId: setTicketExternal
      summary: Link a ticket to where an integration made it (API keys only), e.g. a Bugfixes report
      description: The same object can be sent as `external` when creating a backlog ticket with an API key. A null body clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalRef' }
      responses:
        '204': { description: Linked. }
        '400': { description: Invalid reference (source must be bugfixes; project and id required; url http(s)). }
        '403': { description: Only integrations (API keys) set references. }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/{provider}/connect:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [github, bitbucket] } }
    get:
      tags: [Organizations]
      operationId: integrationConnectURL
      summary: Where an org admin goes to install the GitHub App or authorize Bitbucket
      description: The link carries a sealed state tied to the org (15 minutes). 503 when the provider isn't configured on the server.
      responses:
        '200': { description: The link., content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }
        '403': { description: Not a signed-in org admin. }
        '503': { description: Provider not configured. }

  /integrations/{provider}/complete:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [github, bitbucket] } }
    post:
      tags: [Organizations]
      operationId: integrationComplete
      summary: Finish connecting after the provider sends the admin back
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string }
                installation_id: { type: string, description: GitHub. Checked with the app before it's stored. }
                code: { type: string, description: Bitbucket OAuth code. }
      responses:
        '204': { description: Connected. }
        '400': { description: The state expired or is for another org. }
        '403': { description: Not a signed-in org admin. }
        '502': { description: The provider refused (e.g. not this app's installation, bad code). }

  /integrations/{provider}/repos:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [github, bitbucket] } }
    get:
      tags: [Organizations]
      operationId: integrationRepos
      summary: Repositories the org's connection can see (org admins), first 100
      responses:
        '200':
          description: Repositories.
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { full_name: { type: string }, default_branch: { type: string }, private: { type: boolean } } } }
        '409': { description: Not connected. }

  /projects/{projectId}/repos:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: projectRepos
      summary: Repositories linked to the project
      responses:
        '200':
          description: Linked repositories.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectRepo' } }
    post:
      tags: [Projects]
      operationId: linkProjectRepo
      summary: Link a repository the org's connection can see (org admins); one project per repo in an org
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [provider, full_name], properties: { provider: { type: string, enum: [github, bitbucket] }, full_name: { type: string } } }
      responses:
        '201': { description: Linked., content: { application/json: { schema: { $ref: '#/components/schemas/ProjectRepo' } } } }
        '400': { description: The connection can't see that repository. }
        '409': { description: Already linked to a project in this org, or not connected. }
    delete:
      tags: [Projects]
      operationId: unlinkProjectRepo
      summary: Unlink a repository (org admins)
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [github, bitbucket] } }
        - { name: full_name, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: Unlinked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/epics:
    get:
      tags: [Tickets]
      operationId: listEpics
      summary: A project's epics, with progress and size
      description: >-
        Epics are large pieces of work: they stay in the backlog (never on a board or in a sprint), take no estimate, and can't
        sit anywhere inside another epic. Work joins one by becoming its sub-ticket. Progress counts the epic's direct
        sub-tickets (duplicates left out); size sums their estimates as points. Open epics come first, by backlog position.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Epics.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    key: { type: [string, 'null'] }
                    title: { type: string }
                    priority: { type: string, enum: [low, medium, high, urgent] }
                    done: { type: boolean }
                    resolution: { type: [string, 'null'] }
                    progress: { $ref: '#/components/schemas/EpicProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/group:
    get:
      tags: [Tickets]
      operationId: getTicketGroup
      summary: Open sub-tickets that would move with a ticket leaving its board
      description: >-
        When a ticket leaves its board (to the backlog, or another board), its sub-tickets on that board that aren't done,
        at any depth, go with it. Finished ones stay as the board's history; ones on other boards belong to those teams.
        Empty for a backlog ticket.
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sub-tickets, parents first.
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, key: { type: [string, 'null'] }, title: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/history:
    get:
      tags: [Tickets]
      operationId: getTicketHistory
      summary: A ticket's lifecycle history, oldest first
      description: >-
        Each stage the ticket entered, or skipped on the way to a later one: the backlog, a board column (named as it was then),
        and resolved (done, wont_do or duplicate). Created straight on a board, its backlog and any earlier columns are skipped;
        moving forward skips the columns jumped over. Append-only and recorded with each change. Same access as reading the
        ticket; resolved tickets keep their history. History starts from when it was introduced (October 2026).
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entries, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [at, stage, outcome, stage_order, done]
                  properties:
                    at: { type: string, format: date-time }
                    stage: { type: string, enum: [backlog, column, resolved] }
                    outcome: { type: string, enum: [entered, skipped] }
                    stage_order: { type: integer, description: 'backlog 0, a column its position + 1, resolved last' }
                    board_id: { type: string, format: uuid }
                    board_name: { type: string }
                    column_id: { type: string, format: uuid }
                    column_name: { type: string }
                    done: { type: boolean, description: "The board's last column." }
                    resolution: { type: string, enum: [done, wont_do, duplicate] }
                    actor: { type: string, description: "A user id or agent name; absent when the system did it." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/prs:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      operationId: getTicketPRs
      summary: Pull requests linked to the ticket, newest first
      description: >-
        A PR in a repo linked to the ticket's project is linked when its branch, title or description mentions the ticket's
        key (TL-123; only the project's own prefix counts). Kept up to date by the provider webhooks. When a linked PR is
        merged, the ticket moves to its board's Done column (or is resolved in the backlog) with a "Closed by" comment.
      responses:
        '200':
          description: Linked PRs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: { type: string, enum: [github, bitbucket] }
                    repo: { type: string }
                    number: { type: integer }
                    url: { type: string }
                    title: { type: string }
                    state: { type: string, enum: [open, draft, merged, closed] }
                    author: { type: string }
                    branch: { type: string }
                    updated_at: { type: string, format: date-time }

  /webhooks/github:
    post:
      tags: [Organizations]
      operationId: githubWebhook
      summary: GitHub App webhook (X-Hub-Signature-256 with GITHUB_WEBHOOK_SECRET)
      description: >-
        pull_request events link PRs to the tickets whose keys they mention (in repos linked to a project of an org connected
        through that installation); merging closes them, once. An uninstalled app disconnects the org. A 5xx makes GitHub redeliver.
      security: []
      responses:
        '204': { description: Accepted. }
        '400': { description: Bad signature. }
        '503': { description: Not configured. }

  /webhooks/bitbucket/{link}:
    parameters:
      - { name: link, in: path, required: true, schema: { type: string, format: uuid }, description: The linked repo the webhook was made for. }
    post:
      tags: [Organizations]
      operationId: bitbucketWebhook
      summary: Bitbucket repository webhook, one per linked repo
      description: >-
        TrackLin.es creates this webhook itself when an org admin links a Bitbucket repo (POST /projects/{id}/repos),
        with its own random secret (sealed, never shown) and this URL naming the link; unlinking removes it.
        Deliveries are verified with that link's secret (X-Hub-Signature) and only affect that link's org and repo:
        pullrequest:* events (X-Event-Key) link PRs to the tickets they mention; MERGED closes them, once.
      security: []
      responses:
        '204': { description: Accepted. }
        '400': { description: Bad signature. }
        '404': { description: Unknown or unlinked repo. }

  /integrations/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [bugfixes] } }
    get:
      tags: [Organizations]
      operationId: getIntegration
      summary: Whether the org is connected to a provider (any org member); never returns the secret
      responses:
        '200':
          description: Connection status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  connected: { type: boolean }
                  base_url: { type: string }
                  account: { type: string, description: 'GitHub: the first connected account (kept for older clients); see accounts.' }
                  accounts:
                    type: array
                    description: 'GitHub only: every GitHub account (org or user) the org connected. Each project links repos from whichever account owns them.'
                    items:
                      type: object
                      properties:
                        installation_id: { type: string }
                        account: { type: string }
                        updated_by: { type: string }
                        updated_at: { type: string, format: date-time }
                  updated_by: { type: string }
                  updated_at: { type: string, format: date-time }
        '403': { description: Not a signed-in org admin. }
    put:
      tags: [Organizations]
      operationId: connectIntegration
      summary: Connect the org to a provider (org admins). Bugfixes takes an access token from its settings.
      description: The token is sealed (AES-GCM) with the server's TRACKLINES_SECRET_KEY before it's stored; 503 when the server has no key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                base_url: { type: string, default: 'https://api.bugfix.es' }
      responses:
        '204': { description: Connected. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not a signed-in org admin. }
        '503': { description: Integrations aren't configured on this server. }
    delete:
      tags: [Organizations]
      operationId: disconnectIntegration
      summary: Disconnect the org from a provider (org admins)
      description: 'For GitHub, ?installation=<id> disconnects just that account; without it, every GitHub account is disconnected.'
      parameters:
        - { name: installation, in: query, description: 'GitHub only: the installation (account) to disconnect.', schema: { type: string } }
      responses:
        '204': { description: Disconnected. }
        '403': { description: Not a signed-in org admin. }
        '404': { description: That GitHub account isn't connected to this org. }

  /integrations/google-calendar:
    get:
      tags: [Organizations]
      operationId: getGoogleCalendar
      summary: Google Calendar (TL-404) for the org; any member. The admin email is for org admins only.
      responses:
        '200':
          description: Whether the server offers it and the org is connected, plus what a Workspace admin authorizes for domain-wide delegation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [google-calendar] }
                  available: { type: boolean, description: The server has a Google service account. }
                  connected: { type: boolean }
                  client_id: { type: string, description: The service account's client ID, for admin.google.com → Security → API controls → Domain-wide delegation. }
                  scope: { type: string, description: The one scope to authorize (read-only calendars). }
                  connection:
                    type: object
                    properties:
                      domain: { type: string }
                      admin_email: { type: string, description: Org admins only. }
                      holidays_calendar: { type: string }
                      connected_at: { type: string, format: date-time }
                      last_sync_at: { type: string, format: date-time, nullable: true }
                      last_sync_error: { type: string }
    put:
      tags: [Organizations]
      operationId: connectGoogleCalendar
      summary: Connect Google Calendar (org admins). Google is asked first, so only a working connection is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, admin_email]
              properties:
                domain: { type: string, example: example.com }
                admin_email: { type: string, description: A user in the domain. }
                holidays_calendar: { type: string, description: Optional shared calendar of company days off, e.g. en.uk#holiday@group.v.calendar.google.com }
      responses:
        '204': { description: Connected. }
        '400': { description: Bad input, or Google refused (the message says what to fix, e.g. delegation not granted). }
        '403': { description: Not an org admin. }
        '502': { description: Google couldn't be reached. }
        '503': { description: The server has no Google service account. }
    delete:
      tags: [Organizations]
      operationId: disconnectGoogleCalendar
      summary: Disconnect Google Calendar (org admins); the time away it found is deleted with it.
      responses:
        '204': { description: Disconnected. }
  /integrations/google-calendar/sync:
    post:
      tags: [Organizations]
      operationId: syncGoogleCalendar
      summary: Sync time away from Google Calendar now (org admins); it also runs hourly and right after connecting.
      responses:
        '200': { description: The connection, with last_sync_at and last_sync_error (empty when it worked). }
        '404': { description: Not connected. }
        '503': { description: The server has no Google service account. }
  /integrations/google-calendar/test:
    post:
      tags: [Organizations]
      operationId: testGoogleCalendar
      summary: Check Google still lets us read the org's calendars (org admins).
      responses:
        '204': { description: Access works. }
        '400': { description: Google refused; the message says why. }
        '404': { description: Not connected. }
  /google-chat:
    parameters:
      - { name: project_id, in: query, description: 'The project whose space this is; leave out for the whole organization''s space.', schema: { type: string, format: uuid } }
    get:
      tags: [Organizations]
      operationId: getGoogleChat
      summary: Whether a Google Chat space is set up (any member); never returns its URL
      responses:
        '200':
          description: The space's settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  kinds: { type: array, items: { type: string, enum: [created, review, approval, over_capacity, finished, wont_do, assigned, sent_back, retention] } }
                  updated_by: { type: string }
                  updated_at: { type: string, format: date-time }
    put:
      tags: [Organizations]
      operationId: setGoogleChat
      summary: Post notifications into a Google Chat space (org admins)
      description: 'url is the space''s incoming webhook (https://chat.googleapis.com/v1/spaces/…); leave it out to change only the kinds. Defaults: created, review, approval, over_capacity, finished, wont_do. A project''s space gets its events; the org''s gets every project''s.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: { type: string, format: uuid }
                url: { type: string }
                kinds: { type: array, items: { type: string } }
      responses:
        '204': { description: Saved. }
        '400': { description: Not a Google Chat webhook URL, an unknown kind, or no URL yet. }
        '403': { description: Not a signed-in org admin. }
    delete:
      tags: [Organizations]
      operationId: deleteGoogleChat
      summary: Stop posting to a Google Chat space (org admins)
      responses:
        '204': { description: Removed. }

  /google-chat/test:
    post:
      tags: [Organizations]
      operationId: testGoogleChat
      summary: Post a test message to a Google Chat space (org admins)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { project_id: { type: string, format: uuid } } }
      responses:
        '204': { description: Sent. }
        '409': { description: No space set up. }
        '502': { description: Google Chat refused it (the reason is in the body). }

  /ticket-keys/{key}:
    get:
      tags: [Tickets]
      operationId: getTicketByKey
      summary: A ticket by its key (e.g. TL-123, case-insensitive), same as GET /tickets/{ticketId}
      description: MCP tools also accept keys wherever they take a ticket_id, parent_id or ticket_ids.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, example: TL-123 } }
      responses:
        '200':
          description: The ticket with where it lives.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Get a ticket and its board context
      description: Use `board_id` to look up the Done column before closing a ticket.
      responses:
        '200':
          description: Ticket details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Update a ticket
      description: "`title` is required; empty `type` and `priority` retain their current values."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketInput' }
      responses:
        '204': { description: Ticket updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tickets]
      operationId: deleteTicket
      summary: Delete a ticket
      responses:
        '204': { description: Ticket deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/claim:
    post:
      tags: [Tickets]
      operationId: claimTicket
      summary: Assign an unassigned ticket to the caller
      description: AI keys and signed-in people may claim tickets. Server/service keys cannot claim work.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Claimed ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Server/service API keys cannot claim tickets. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Ticket is already assigned or blocked by another ticket. }

  /tickets/{ticketId}/release:
    post:
      tags: [Tickets]
      operationId: releaseTicket
      summary: Clear the caller's assignment from a ticket
      description: AI keys and signed-in people may release ticket assignments. Server/service keys cannot.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '204': { description: Assignment cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Server/service API keys cannot release ticket assignments. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Ticket is not assigned to the caller. }

  /tickets/{ticketId}/assignee:
    put:
      tags: [Tickets]
      operationId: assignTicket
      summary: Assign or unassign a ticket
      description: Set `assignee` to an active member of the caller's organization or an active AI key name; set it to null to unassign. Server/service keys cannot be assignees.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Could not verify organization membership with Clerk. }

  /tickets/{ticketId}/labels:
    put:
      tags: [Tickets]
      operationId: setTicketLabels
      summary: Replace a ticket's labels
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels: { $ref: '#/components/schemas/Labels' }
      responses:
        '200':
          description: Normalised labels as stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/open-tickets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tickets]
      operationId: listOpenTickets
      summary: Tickets that aren't done, across boards and backlog, in pick order
      description: >-
        Every ticket in the project that isn't in its board's Done column, plus the backlog, without descriptions.
        Ordered the way work is picked: tickets in their board's open sprint first, then priority (urgent first),
        then on a board before in the backlog, then oldest.
        The MCP tool list_open_tickets maps to this.
      parameters:
        - name: assignee
          in: query
          schema: { type: string, enum: [unassigned, me] }
          description: unassigned, or me (the caller's agent name or user id). Omit for everyone.
        - name: blocked
          in: query
          schema: { type: string, enum: [exclude] }
          description: exclude leaves out tickets waiting on unfinished work.
        - { name: priority, in: query, schema: { type: array, items: { type: string, enum: [low, medium, high, urgent] } }, style: form, explode: true, description: Any of these priorities. }
      responses:
        '200':
          description: Open tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    title: { type: string }
                    type: { type: string, enum: [bug, feature, task, epic] }
                    priority: { type: string, enum: [low, medium, high, urgent] }
                    estimate: { type: [string, 'null'] }
                    labels: { type: array, items: { type: string } }
                    assigned_to: { type: [string, 'null'] }
                    blocked: { type: boolean }
                    in_sprint: { type: boolean, description: In its board's open sprint. }
                    board_id: { type: [string, 'null'], format: uuid, description: Null in the backlog. }
                    board_name: { type: [string, 'null'] }
                    column_id: { type: [string, 'null'], format: uuid }
                    column_name: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/backlog/page:
    get:
      tags: [Tickets]
      operationId: pageBacklog
      summary: One page of the backlog, filtered and ordered by the server
      description: By default ready tickets come first, then blocked ones, ordered by backlog position. `sort=newest` or `sort=oldest` orders the full filtered backlog by creation date before pagination. The `counts` field is per type and respects label and priority filters, but not the type filter, for type tabs. Label counts cover the whole backlog. The unpaged list stays at /projects/{projectId}/backlog.
      parameters:
        - { name: epic, in: query, schema: { type: string, format: uuid }, description: "Only this epic's sub-tickets, at any depth." }
        - { name: priority, in: query, schema: { type: array, items: { type: string, enum: [low, medium, high, urgent] } }, style: form, explode: true, description: Any of these priorities; counts follow it. }
        - $ref: '#/components/parameters/ProjectId'
        - { name: type, in: query, schema: { type: string, enum: [bug, feature, task, epic] } }
        - { name: sort, in: query, description: Order tickets globally before pagination. Defaults to the manual backlog order., schema: { type: string, enum: [manual, newest, oldest], default: manual } }
        - name: label
          in: query
          description: Repeatable; a ticket matches if it has any of them (case-insensitive).
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: The page and per-type counts.
          content:
            application/json:
              schema:
                type: object
                required: [tickets, counts, labels]
                properties:
                  labels:
                    type: array
                    description: Labels in the whole backlog (no filters applied), most used first, for a label filter.
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        count: { type: integer }
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
                  counts:
                    type: object
                    properties:
                      all: { type: integer }
                      bug: { type: integer }
                      feature: { type: integer }
                      task: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/labels:
    get:
      tags: [Projects]
      operationId: listProjectLabels
      summary: Labels in use in a project, most used first
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Labels with ticket counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assignees:
    get:
      tags: [Tickets]
      operationId: listAssignees
      summary: List organization members and AI keys available for assignment
      description: Only members of the active organization and its active AI keys are listed. Service/API keys are excluded.
      responses:
        '200':
          description: Assignable identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    label: { type: string }
                    kind: { type: string, enum: [person, ai] }
                    name: { type: string, description: 'People only: real name (also when label is "You"), for @ mentions.' }
                    username: { type: string, description: 'People only: Clerk username, when set. @username mentions them.' }
                    image_url: { type: string, description: 'People only: their Clerk avatar image, when they have one.' }
                    away:
                      type: object
                      description: 'People only, with Google Calendar connected (TL-407): on holiday now.'
                      properties:
                        until: { type: string, format: date-time, description: When they're back (UTC); back-to-back leave is joined up. }
                        company: { type: boolean, description: A company day off rather than their own leave. }
                    away_next:
                      type: object
                      description: 'People only: leave starting within the next 7 days.'
                      properties:
                        from: { type: string, format: date-time }
                        until: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Could not load organization members from Clerk. }

  /tickets/{ticketId}/org:
    get:
      tags: [Tickets]
      operationId: ticketOrganization
      summary: Which of my organizations a ticket is in
      description: For a ticket link opened while another organization is active, so the app can offer to switch. Answers only a signed-in person who belongs to the ticket's organization; anyone else (and API keys) gets 404, as if it didn't exist.
      security:
        - clerkSession: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: The ticket's organization.
          content:
            application/json:
              schema: { type: object, properties: { org_id: { type: string } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{ticketId}/resolve:
    post:
      tags: [Tickets]
      operationId: resolveTicket
      summary: Close a ticket as done or won't do
      description: >-
        Marks a backlog ticket resolved without putting it on a board. A resolved ticket counts as done everywhere
        (blockers, sub-ticket progress, the done flag), leaves backlog pages and open-ticket lists, keeps its links
        and stays readable by id. Resolving again is a no-op; moving it onto a board reopens it. If it was the last
        unfinished sub-ticket of its parent, the parent is completed too (resolved if it's in the backlog, moved to
        its board's Done column if it's on a board), and so on up the chain. A ticket on a board is moved to the
        board's Done column with the resolution (moving it out again reopens it), for people and service keys
        (e.g. Bugfixes when a report is resolved or ignored). AI keys finish board tickets by moving them
        instead (409), so a board's agent review still applies. MCP tool resolve_ticket.
        With resolution wont_do it's closed as decided against (the ticket's resolution says so; the reason, if given,
        is added as a comment). No body resolves it as done. Agents cannot resolve tickets that have entered human review.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { resolution: { type: string, enum: [done, wont_do], default: done }, reason: { type: string, maxLength: 10000 } } }
      responses:
        '204': { description: Resolved. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The ticket is on a board or an agent is attempting to bypass human review. }
  /tickets/{ticketId}/duplicate:
    post:
      tags: [Tickets]
      operationId: markTicketDuplicate
      summary: Close a ticket as a duplicate
      description: >-
        Marks ticketId as a duplicate of another ticket in the same project, closes it, and links it from the
        original. Optionally copies labels and comments to the original. Duplicate tickets do not count toward
        sprint velocity or carry-over. MCP tool mark_duplicate accepts ticket keys or ids.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicate_of]
              properties:
                duplicate_of: { type: string, description: Original ticket UUID (MCP also accepts a ticket key). }
                copy_labels: { type: boolean, default: false }
                copy_comments: { type: boolean, default: false }
      responses:
        '204': { description: Ticket marked as a duplicate. }
        '400': { description: Tickets must be different, in the same project, and the original cannot itself be a duplicate. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The ticket is already marked as a duplicate. }
  /tickets/{ticketId}/backlog:
    post:
      tags: [Tickets]
      operationId: sendTicketToBacklog
      summary: Move a ticket into its project's backlog
      description: Agents cannot move tickets awaiting human review into the backlog.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '204': { description: Ticket moved to backlog. }
        '200': { description: "Moved, with its open sub-tickets on the board: {also_moved: [{id, key, title}]}. If one can't go, nothing moves and the error names it." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: An agent attempted to bypass a pending human review. }

  /tickets/{ticketId}/blocked-by:
    put:
      tags: [Tickets]
      operationId: setTicketDependencies
      summary: Replace the tickets blocking this ticket
      description: Use an empty `ticket_ids` array to clear dependencies. Dependencies must be in the same project and cannot form a cycle.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_ids]
              properties:
                ticket_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Dependencies replaced. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enquiries:
    post:
      tags: [Contact]
      operationId: sendEnquiry
      summary: Send a contact-form message to the TrackLin.es team
      description: Public, no account needed, and rate limited per address. Filed in the ChewedFeed HQ enquiry inbox.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email, maxLength: 320 }
                company: { type: string, maxLength: 160 }
                message: { type: string, maxLength: 5000 }
                source_path: { type: string, maxLength: 500, description: The page the form was sent from. }
      responses:
        '204': { description: Sent. }
        '400': { description: A required field is missing, too long, or the email isn't valid. }
        '429': { description: Too many messages from this address. }
        '502': { description: The enquiry system couldn't be reached; try again. }
        '503': { description: Enquiries aren't configured. }

  /short-links:
    post:
      tags: [Tickets]
      operationId: createShortLink
      summary: A short link for a TrackLin.es link
      description: 'For "Copy link": shortens a link to this site (tickets, boards…) through 1tn. The same link always gives the same short link. Links to any other site are refused.'
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: 'https://tracklin.es/tickets/9205518f-7140-44cf-b155-4e9b8d6a2d48' }
                title: { type: string, maxLength: 120, example: 'TL-204 on TrackLin.es', description: 'Shown for the short link (the shortener can''t read pages behind our sign-in). Anyone can look a short link''s title up, so keep it free of anything private. Default: TrackLin.es.' }
      responses:
        '200':
          description: The short link.
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string, example: 'https://1tn.pw/yJjWqM' } } }
        '400': { description: Not a link to this site. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: The shortener couldn't be reached or refused it. }

  /mentions:
    get:
      tags: [Tickets]
      operationId: listMentions
      summary: Tickets that @mention the caller
      description: One row per ticket, newest mention first. Mentions are recorded when a comment names someone, and stay when the notification is cleared.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: hide_done, in: query, description: true leaves out done and closed tickets., schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Mentioned tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ticket_id: { type: string, format: uuid }
                    key: { type: string, example: TL-123 }
                    title: { type: string }
                    done: { type: boolean }
                    project_name: { type: string }
                    actor: { type: string, description: Who mentioned the caller last (user id or agent name). }
                    comment_id: { type: string, description: 'The comment, or "" for mentions from before they were recorded.' }
                    mentioned_at: { type: string, format: date-time }
        '400': { description: limit is not 1–100. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mentions/page:
    get:
      tags: [Tickets]
      operationId: pageMentions
      summary: Tickets that @mention the caller, a page at a time
      description: The same list as /mentions, with how many there are in all.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: hide_done, in: query, description: true leaves out done and closed tickets., schema: { type: boolean, default: false } }
      responses:
        '200':
          description: One page of mentioned tickets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentions: { type: array, description: As in /mentions., items: { type: object } }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
        '400': { description: page or per_page is out of range. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets/{ticketId}/comments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Comments]
      operationId: listTicketComments
      summary: List a ticket's conversation
      responses:
        '200':
          description: Comments in chronological order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      operationId: appendTicketComment
      summary: Append an update to a ticket
      description: Adds a top-level comment to the ticket conversation. Use this for progress reports or follow-up findings; it does not replace the ticket description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
            example:
              body: |
                Fixed in the backend. The request now succeeds with the production origin.
      responses:
        '201':
          description: Comment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticketId}/move:
    post:
      tags: [Tickets]
      operationId: moveTicket
      summary: Move a ticket to another column
      description: >-
        To close a ticket, first get its board, then move it to the column with the greatest `position` (the board's Done column). `position` may be zero.
        Moving a ticket into a sprint (from the backlog, another board or outside the sprint) on the sprint's last day answers 409;
        moves inside the sprint, to Done, or out of it are allowed.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicket'
      responses:
        '204':
          description: Ticket moved.
        '200':
          description: "Either an agent (API key) moved it into Done on a board with agent review: it waits in the column before Done for a person's review (see /tickets/{ticketId}/review). Or it moved to another board and its open sub-tickets on the old board came too (also_moved); if one can't, nothing moves and the error names it."
          content: { application/json: { schema: { type: object, properties: { needs_review: { type: boolean }, message: { type: string }, also_moved: { type: array, items: { type: object, properties: { id: { type: string }, key: { type: [string, 'null'] }, title: { type: string } } } } } } } }
        '409':
          description: The target board's sprint ends today, so its scope is locked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticketId}/attachments:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Attachments]
      operationId: listTicketAttachments
      summary: List ticket attachments
      responses:
        '200':
          description: Attachment records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Attachments]
      operationId: recordTicketAttachment
      summary: Record an uploaded UploadThing file on a ticket
      description: The file must already be uploaded; this endpoint stores its metadata and does not upload bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentInput' }
      responses:
        '201':
          description: Attachment recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Ticket is in its Done column. }

  /attachments/{attachmentId}:
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: Delete an attachment and its stored file
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Attachment deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{attachmentId}/keep:
    post:
      tags: [Attachments]
      operationId: keepAttachment
      summary: Keep a year-old file for another year
      description: Files are warned about a year after they're added (or last kept) and deleted at 13 months unless kept. Org admins and the file's uploader can keep it; API keys can't.
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Kept for another year. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not an org admin or the file's uploader, or an API key. }
        '404': { $ref: '#/components/responses/NotFound' }
  /attachments/retention:
    get:
      tags: [Attachments]
      operationId: attachmentRetention
      summary: The org's file clean-up
      description: Files due to be deleted (warned, soonest first) and files the clean-up has deleted (newest first, the latest 500). Org admins only; API keys can't.
      responses:
        '200':
          description: Due and deleted files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  due:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        ticket_id: { type: string, format: uuid }
                        ticket_key: { type: string }
                        ticket_title: { type: string }
                        name: { type: string }
                        size: { type: integer }
                        created_by: { type: string }
                        delete_on: { type: string, format: date-time }
                  deleted:
                    type: array
                    items:
                      type: object
                      properties:
                        ticket_id: { type: string, format: uuid }
                        ticket_key: { type: string }
                        ticket_title: { type: string }
                        name: { type: string }
                        size: { type: integer }
                        created_by: { type: string }
                        deleted_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not an org admin, or an API key. }

  /boards/{boardId}/reports/sprints:
    parameters:
      - { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: from, in: query, schema: { type: string, format: date }, description: "First day (in the caller's Tracklines-Timezone); default 90 days ago." }
      - { name: to, in: query, schema: { type: string, format: date }, description: Last day, inclusive; default today. At most two years after from. }
      - { name: format, in: query, schema: { type: string, enum: [json, md, markdown] }, description: "md (or markdown): the report as a Markdown download (text/markdown, attachment) with Mermaid charts, for wikis and docs (TL-399)." }
    get:
      tags: [Sprints]
      operationId: boardSprintReport
      summary: "How a board's sprints went over a period (TL-397): sprints that closed in it plus the open one, totals, the period before for trends, and a one-line summary. Never per person."
      responses:
        '200':
          description: The report. Sprints from before reports were recorded have estimated (planned = what they held at close) and no added/removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  board_id: { type: string }
                  board_name: { type: string }
                  unit: { type: string, enum: [points, tickets] }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  summary: { type: string, example: Delivered 84% of planned work across 6 sprints, up from 71%. }
                  sprints:
                    type: array
                    items:
                      type: object
                      properties:
                        number: { type: integer }
                        starts_at: { type: string, format: date-time }
                        ends_at: { type: string, format: date-time }
                        closed_at: { type: [string, 'null'] }
                        goal: { type: string }
                        goal_met: { type: [boolean, 'null'] }
                        planned: { type: number }
                        estimated: { type: boolean }
                        done: { type: number }
                        predictability: { type: [number, 'null'] }
                        added: { type: [number, 'null'] }
                        removed: { type: [number, 'null'] }
                        carried: { type: [number, 'null'] }
                        velocity: { type: [number, 'null'] }
                        approved_over: { type: [number, 'null'] }
                        mix: { type: array, items: { $ref: '#/components/schemas/ReportMix' } }
                  totals: { $ref: '#/components/schemas/ReportTotals' }
                  previous: { $ref: '#/components/schemas/ReportTotals' }
        '400': { description: Bad dates. }
        '404': { description: Not your organization's board. }
  /projects/{projectId}/reports/sprints:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: from, in: query, schema: { type: string, format: date }, description: "First day (in the caller's Tracklines-Timezone); default 90 days ago." }
      - { name: to, in: query, schema: { type: string, format: date }, description: Last day, inclusive; default today. }
      - { name: format, in: query, schema: { type: string, enum: [json, md, markdown] }, description: "md (or markdown): the report as a Markdown download (text/markdown, attachment) with Mermaid charts, for wikis and docs (TL-399)." }
    get:
      tags: [Sprints]
      operationId: projectSprintReport
      summary: "A project's sprint boards together (TL-398): each board's report, points and tickets totalled apart, predictability across both, and calendar months. Anyone in the organization."
      responses:
        '200': { description: The roll-up., content: { application/json: { schema: { $ref: '#/components/schemas/ReportRollup' } } } }
        '400': { description: Bad dates. }
        '404': { description: Not your organization's project. }
  /org/reports/sprints:
    parameters:
      - { name: from, in: query, schema: { type: string, format: date }, description: "First day (in the caller's Tracklines-Timezone); default 90 days ago." }
      - { name: to, in: query, schema: { type: string, format: date }, description: Last day, inclusive; default today. }
      - { name: format, in: query, schema: { type: string, enum: [json, md, markdown] }, description: "md (or markdown): the report as a Markdown download (text/markdown, attachment) with Mermaid charts, for wikis and docs (TL-399)." }
    get:
      tags: [Sprints]
      operationId: orgSprintReport
      summary: "Every project in the organization together (TL-398), by project. Organization admins only (people, not API keys)."
      responses:
        '200': { description: The roll-up., content: { application/json: { schema: { $ref: '#/components/schemas/ReportRollup' } } } }
        '403': { description: Not an organization admin. }
  /boards/{boardId}/velocity:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Sprints]
      operationId: getBoardVelocity
      summary: Velocity per closed sprint, plus the open sprint's burn data
      description: >-
        A closed sprint's completed value is its tickets that were done when it closed (closing carries
        the rest into the next sprint). Unit is points on a board with an estimate scale (t-shirt sizes
        count XS=1, S=2, M=3, L=5, XL=8; unestimated tickets count 0), otherwise tickets.
      responses:
        '200':
          description: Velocity history and burn data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Velocity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /boards/{boardId}/flow:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      operationId: getBoardFlow
      summary: Cycle time and weekly throughput for finished tickets
      description: >-
        Returns tickets completed during the requested rolling window of UTC calendar weeks, including
        empty throughput weeks. Cycle-time percentiles include only tickets with a recorded started_at;
        older tickets without an exact start time remain in throughput but have a null cycle_days.
      parameters:
        - name: weeks
          in: query
          description: Number of UTC calendar weeks including the current week.
          schema: { type: integer, minimum: 1, maximum: 52, default: 12 }
      responses:
        '200':
          description: Finished tickets, cycle-time percentiles, and throughput by week.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardFlow' }
        '400': { description: weeks must be between 1 and 52. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /boards/{boardId}/sprints:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Sprints]
      operationId: listSprints
      summary: List a board's sprints
      responses:
        '200':
          description: Sprints, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sprint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sprints]
      operationId: startSprint
      summary: Start a sprint and pull in unassigned board tickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [length_days]
              properties:
                length_days: { type: integer, minimum: 1, maximum: 365 }
                goal: { type: string, maxLength: 200, description: Optional one-line goal. }
      responses:
        '201':
          description: Sprint started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Board already has an open sprint, or is a kanban board." }

  /sprints/{sprintId}:
    get:
      tags: [Sprints]
      operationId: getSprint
      summary: One sprint, read-only, with its burn data and tickets
      description: >-
        For a closed sprint, tickets are the ones it finished (closing moves the rest to the next sprint) and burn.total
        is what it held when it closed; sprints closed before scope was recorded fall back to what they finished and
        carried_over is null. burn.ends_at is the close time. For an open sprint, everything reflects now.
      parameters:
        - name: sprintId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The sprint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sprint'
                  - type: object
                    properties:
                      unit: { type: string, enum: [points, tickets] }
                      burn: { $ref: '#/components/schemas/Velocity/properties/current' }
                      tickets: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
                      carried_over: { type: [integer, 'null'], description: Tickets moved on to the next sprint when it closed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sprints]
      operationId: updateSprintLength
      summary: Change the length of an open or scheduled sprint
      parameters:
        - name: sprintId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send length_days and/or goal.
              properties:
                length_days: { type: integer, minimum: 1, maximum: 365 }
                goal: { type: string, maxLength: 200, description: '"" clears it.' }
      responses:
        '200':
          description: Updated sprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }
  /sprints/{sprintId}/close:
    post:
      tags: [Sprints]
      operationId: closeSprint
      summary: Close a sprint; optionally start or schedule the next one
      description: >-
        With no body, the sprint just closes: unfinished tickets stay on the board, out of any sprint, until the next
        POST /boards/{id}/sprints, which takes them in along with a waiting planned sprint (and its goal). Give
        next_length_days and/or next_starts_at to open the next sprint at once instead, as auto-close does when a sprint
        runs out: unfinished tickets carry over, and a planned sprint (refinement) within capacity or approved becomes the
        next sprint (its length unless next_length_days is given, and its tickets, which join the first column). A planned
        sprint over capacity without approval isn't promoted and stays planned.
      parameters:
        - name: sprintId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                next_length_days: { type: integer, minimum: 1, maximum: 365, description: Defaults to the current sprint's length. }
                next_starts_at: { type: string, format: date-time, description: Defaults to now; a future value schedules the next sprint. }
      responses:
        '204': { description: Closed; no next sprint started. }
        '200':
          description: The next sprint, started or scheduled (when asked for).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Requires a signed-in organization admin or the linked team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }

  /boards/{boardId}/planned-sprints:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Sprints]
      operationId: listPlannedSprints
      summary: A board's planned sprints with their tickets and capacity
      responses:
        '200':
          description: Planned sprints, next first (at most 2).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlannedSprint' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sprints]
      operationId: planSprint
      summary: Plan a sprint after the current one (org admins and the board team's leaders)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [length_days]
              properties:
                length_days: { type: integer, minimum: 1, maximum: 365 }
                goal: { type: string, maxLength: 200 }
      responses:
        '201':
          description: The board's planned sprints.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlannedSprint' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not an org admin or the board team's leader. }
        '409': { description: Already 2 planned sprints, or a kanban board. }

  /boards/{boardId}/live:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      operationId: streamBoardLiveEvents
      summary: Stream standup and refinement changes for a board
      description: >-
        Server-sent events fan out across backend instances through Valkey. Connects with the latest retained event,
        then streams updates; sends a heartbeat comment every 20 seconds. Events are named `standup`,
        `standup-ended`, or `refinement`.
      responses:
        '200':
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No active organization in the caller's session or API key. }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Valkey is unavailable. }

  /boards/{boardId}/live/standup:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      operationId: getLiveStandup
      summary: Get the current board standup session
      responses:
        '200': { description: The active standup session, content: { application/json: { schema: { $ref: '#/components/schemas/LiveStandup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Valkey is unavailable. }
    post:
      tags: [Boards]
      operationId: startLiveStandup
      summary: Start or replace the board standup session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                people:
                  type: array
                  items:
                    type: object
                    required: [id, label]
                    properties:
                      id: { type: string }
                      label: { type: string }
      responses:
        '201': { description: Started session, content: { application/json: { schema: { $ref: '#/components/schemas/LiveStandup' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Valkey is unavailable. }

  /projects/{projectId}/live:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: streamProjectLiveEvents
      summary: Stream the project's hosted refinement session
      description: >-
        Server-sent events, like the board stream: the latest retained event on connect, then updates, with a heartbeat
        every 20 seconds. Events are `refinement-session` (the whole session) and `refinement-session-ended`.
      responses:
        '200': { description: Server-sent event stream., content: { text/event-stream: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Valkey is unavailable. }

  /projects/{projectId}/live/refinement:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getHostedRefinement
      summary: The project's running refinement session, with who's here
      responses:
        '200': { description: The session., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '404': { description: No session running, or the project isn't in the caller's organization. }
        '503': { description: Valkey is unavailable. }
    post:
      tags: [Projects]
      operationId: startHostedRefinement
      summary: Start a refinement session and host it
      responses:
        '201': { description: Started; the caller is the host., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A session is already running; join it instead. }
        '503': { description: Valkey is unavailable. }
    delete:
      tags: [Projects]
      operationId: endHostedRefinement
      summary: End the session for everyone (host only)
      responses:
        '204': { description: Ended. }
        '403': { description: Only the host can end it. }
        '404': { description: No session running. }

  /projects/{projectId}/live/refinement/join:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: joinHostedRefinement
      summary: Join the session, and stay in it
      description: Call every 30 seconds while taking part; anyone not seen for a minute drops off the list. A host gone for two minutes ends the session.
      responses:
        '200': { description: The session, with the caller in it., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '404': { description: No session running. }

  /projects/{projectId}/live/refinement/leave:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: leaveHostedRefinement
      summary: Leave the session
      responses:
        '204': { description: Left. }

  /projects/{projectId}/live/refinement/focus:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [Projects]
      operationId: setHostedRefinementFocus
      summary: Say what the host has open, so followers see it (host only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostedFocus' }
      responses:
        '200': { description: The session., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '403': { description: Only the host can set it. }
        '404': { description: No session running. }

  /projects/{projectId}/live/refinement/host:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [Projects]
      operationId: handOverHostedRefinement
      summary: Hand over hosting, or take over from a host who has gone
      description: The host can hand over to anyone in the session. Anyone in the session can make themselves host once the host hasn't been seen for a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string } } }
      responses:
        '200': { description: The session with its new host., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '400': { description: That person isn't in the session. }
        '403': { description: Only the host can hand over (or take over from a host who has gone). }
        '404': { description: No session running. }

  /boards/{boardId}/live/standup/session:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      operationId: getHostedStandup
      summary: Who's in the standup and what the host has open
      description: Starting a standup makes the starter its host; ending it ends the session. Events (`standup-session`, `standup-session-ended`) go out on the board's live stream.
      responses:
        '200': { description: The session., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '404': { description: No standup running, or the board isn't in the caller's organization. }
        '503': { description: Valkey is unavailable. }

  /boards/{boardId}/live/standup/join:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      tags: [Boards]
      operationId: joinHostedStandup
      summary: Join the standup, and stay in it (call every 30 seconds)
      responses:
        '200': { description: The session, with the caller in it., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '404': { description: No standup running. }

  /boards/{boardId}/live/standup/leave:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      tags: [Boards]
      operationId: leaveHostedStandup
      summary: Leave the standup
      responses:
        '204': { description: Left. }

  /boards/{boardId}/live/standup/focus:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    put:
      tags: [Boards]
      operationId: setHostedStandupFocus
      summary: Say what the host has open and how the board is filtered (host only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostedFocus' }
      responses:
        '200': { description: The session., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '403': { description: Only the host can set it. }
        '404': { description: No standup running. }

  /boards/{boardId}/live/standup/host:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    put:
      tags: [Boards]
      operationId: handOverHostedStandup
      summary: Hand over hosting (e.g. to the next speaker), or take over from a host who has gone
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string } } }
      responses:
        '200': { description: The session with its new host., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSession' } } } }
        '400': { description: That person isn't in the standup. }
        '403': { description: Only the host can hand over (or take over from a host who has gone). }
        '404': { description: No standup running. }

  /boards/{boardId}/live/standup/action:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      tags: [Boards]
      operationId: actOnLiveStandup
      summary: Advance, jump, pause, resume, or end the current standup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [next, previous, jump, pause, resume, end] }
                index: { type: integer, description: Required for jump; clamped to the participant list and review turn. }
      responses:
        '200': { description: Updated session, content: { application/json: { schema: { $ref: '#/components/schemas/LiveStandup' } } } }
        '204': { description: Session ended. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Valkey is unavailable. }

  /planned-sprints/{plannedSprintId}:
    parameters:
      - { name: plannedSprintId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Sprints]
      operationId: updatePlannedSprint
      summary: Change a planned sprint's length and/or goal (org admins and the board team's leaders)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                length_days: { type: integer, minimum: 1, maximum: 365 }
                goal: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The board's planned sprints.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlannedSprint' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not an org admin or the board team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sprints]
      operationId: unplanSprint
      summary: Remove a planned sprint; its tickets stay in the backlog, unplanned and unestimated
      responses:
        '204': { description: Removed; a later planned sprint moves up. }
        '403': { description: Not an org admin or the board team's leader. }
        '404': { $ref: '#/components/responses/NotFound' }

  /planned-sprints/{plannedSprintId}/approve:
    parameters:
      - { name: plannedSprintId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Sprints]
      operationId: approvePlannedSprint
      summary: Accept a planned sprint's current total over capacity (org admins and the board team's leaders, signed in)
      description: Records the total, who and when. If the planned total later goes above it, the sprint needs approval again.
      responses:
        '200':
          description: The planned sprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedSprint' }
        '403': { description: Not an org admin or the board team's leader, or an API key. }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/planned-sprint:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    put:
      tags: [Tickets]
      operationId: planTicket
      summary: Plan a backlog ticket into a planned sprint, sized on that board's scale
      description: >-
        The ticket stays in the backlog until the planned sprint starts. Without an estimate it keeps one already on the same scale.
        planned_sprint_id null takes it out of the plan (and clears the estimate). Going over capacity is allowed; the sprint then
        needs approval before it can start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planned_sprint_id: { type: [string, 'null'], format: uuid }
                estimate: { type: string }
      responses:
        '204': { description: Planned. }
        '400': { description: Estimate isn't on the board's scale. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The ticket is on a board, not in the backlog. }

  /roadmaps:
    get:
      tags: [Roadmaps]
      operationId: listRoadmaps
      summary: List the caller's roadmaps
      responses:
        '200':
          description: Roadmaps owned by the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Roadmap' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /roadmaps/{roadmapId}:
    parameters:
      - name: roadmapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Roadmaps]
      operationId: getRoadmap
      summary: Get a roadmap
      description: Public roadmaps are readable without a token; login_only and team roadmaps require a signed-in member of the owning organization. Non-owner readers see progress counts but not linked-ticket IDs or titles.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Roadmap and items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roadmap' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Roadmap is restricted to its owner. }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Roadmaps]
      operationId: updateRoadmap
      summary: Update a roadmap
      description: Org admins and the project's team leaders. Leaving out visibility keeps it. Changing visibility to or from public needs a signed-in org admin (API keys get 403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoadmapInput' }
      responses:
        '204': { description: Roadmap updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Roadmaps]
      operationId: deleteRoadmap
      summary: Delete a roadmap
      description: Signed-in org admins only; API keys get 403.
      responses:
        '204': { description: Roadmap deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roadmaps/{roadmapId}/updates:
    parameters:
      - name: roadmapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Roadmaps]
      operationId: listRoadmapUpdates
      summary: List dated progress updates
      description: Uses the roadmap's public, login-only, or team visibility rules. Responses contain only update status, note, and date; linked ticket and organization details are never included.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Updates oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoadmapUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Roadmap is restricted to its owner. }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Roadmaps]
      operationId: publishRoadmapUpdate
      summary: Publish a dated progress update
      description: Appends an immutable update to a roadmap owned by the caller's active organization.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoadmapUpdateInput' }
      responses:
        '201':
          description: Update published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadmapUpdate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/roadmaps:
    post:
      tags: [Roadmaps]
      operationId: createRoadmap
      summary: Create a roadmap in a project
      description: Org admins and the project's team leaders. Visibility defaults to team; public needs a signed-in org admin (API keys get 403).
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoadmapInput' }
      responses:
        '201':
          description: Roadmap created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roadmap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roadmaps/{roadmapId}/items:
    put:
      tags: [Roadmaps]
      operationId: replaceRoadmapItems
      summary: Replace a roadmap's item list
      description: Existing item IDs are updated in place; IDs omitted from the submitted list are removed. Unknown or omitted IDs create items.
      parameters:
        - name: roadmapId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RoadmapItemInput' }
      responses:
        '204': { description: Roadmap items replaced. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roadmaps/{roadmapId}/items/{itemId}/tickets:
    put:
      tags: [Roadmaps]
      operationId: setRoadmapItemTickets
      summary: Replace tickets linked to a roadmap item
      description: Linking an epic counts its sub-tickets towards the item's progress (not the epic itself), worked out on every read, so ones added to the epic later count too.
      parameters:
        - name: roadmapId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_ids]
              properties:
                ticket_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Linked tickets replaced. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPIYAML
      summary: This API description, as YAML
      description: Public; no key needed. Built into the API, so it always matches what's running.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /openapi.json:
    get:
      tags: [System]
      operationId: getOpenAPIJSON
      summary: This API description, as JSON
      description: Public; no key needed. The same document as /openapi.yaml.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema: { type: object }

  /live/sessions:
    get:
      tags: [Live]
      operationId: listRunningSessions
      summary: The organization's running standups and refinements
      description: Every hosted standup (on a board) and refinement (on a project) running in the caller's organization, in one request. Archived boards are left out. Empty when live sessions are off.
      responses:
        '200':
          description: Running sessions, by project.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string, enum: [standup, refinement] }
                    id: { type: string, format: uuid, description: The board's (standup) or project's (refinement). }
                    name: { type: string }
                    project_id: { type: string, format: uuid }
                    project_name: { type: string }
                    host: { type: string }
                    people: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /keys:
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List the caller's active API keys, and the organization's service keys
      description: Service keys belong to the organization, so every member sees them and when they expire, whoever made them.
      security:
        - clerkSession: []
      responses:
        '200':
          description: API key metadata. Secret values are never returned after creation.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Create a TrackLin.es API key
      description: The plaintext key is returned only once. This route requires a Clerk session. Only organization admins can create service keys.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyInput' }
      responses:
        '201':
          description: Key created; save the returned `key` securely now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Only organization admins can create service keys. }
        '500': { $ref: '#/components/responses/InternalError' }

  /keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [API keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Your own keys; organization admins can also revoke any of the organization's service keys.
      security:
        - clerkSession: []
      responses:
        '204': { description: API key revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscription:
    get:
      tags: [Billing]
      operationId: getSubscription
      summary: Get the active organization's plan and project limit
      description: The plan belongs to the organization; everyone in it sees it, and its admins buy and manage it.
      responses:
        '200':
          description: Subscription status.
          content:
            application/json:
              schema:
                type: object
                required: [plan, paid, project_limit]
                properties:
                  plan: { type: string, enum: [free, pro, enterprise], description: 'Free: 1 project. Pro: 5. Enterprise: unlimited.' }
                  paid: { type: boolean }
                  project_limit: { type: integer, description: '-1 means unlimited.' }
                  member_limit: { type: integer, description: 'People allowed in the organization (TL-418): 20 on Free and Pro, -1 (unlimited) on Enterprise. AI agents do not count.' }
                  billed: { type: boolean, description: "Paid through a Stripe subscription, so the billing portal can manage it. false for free plans and for plans granted by hand; the portal answers 409 for those." }
                  can_manage: { type: boolean, description: The caller is an org admin, so may upgrade or manage the plan. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Billing status unavailable. }

  /subscription/checkout:
    post:
      tags: [Billing]
      operationId: createCheckoutSession
      summary: Create a Stripe checkout session for the active organization's plan
      description: For an organization that isn't paying yet. One already on a paid plan changes plan instead (POST /subscription/plan).
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { plan: { type: string, enum: [pro, enterprise], default: pro } } }
      responses:
        '200':
          description: Stripe Checkout URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/URLResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not a signed-in admin of the active organization. }
        '409': { description: The organization is already subscribed. }
        '503': { description: Billing is not configured or unavailable. }
        '502': { description: Stripe is unavailable. }

  /subscription/plan:
    post:
      tags: [Billing]
      operationId: changePlan
      summary: Change the organization's paid plan (Pro ↔ Enterprise), prorated
      description: Moves the existing Stripe subscription to the other plan's price; Stripe prorates the difference. Org admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [plan], properties: { plan: { type: string, enum: [pro, enterprise] } } }
      responses:
        '204': { description: Changed; the new project limit applies straight away. }
        '400': { description: Unknown plan. }
        '403': { description: Not a signed-in admin of the active organization. }
        '409': { description: No subscription to change (check out instead), or the plan was granted by hand. }
        '502': { description: Stripe is unavailable. }
        '503': { description: Billing (or that plan) isn't configured. }

  /plans:
    get:
      tags: [Billing]
      operationId: listPlans
      summary: The plans, their project limits and prices (public)
      security: []
      responses:
        '200':
          description: Free, Pro and Enterprise. projects null means unlimited; price is in the currency's smallest unit, from Stripe, and missing when it can't be read.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, enum: [free, pro, enterprise] }
                    projects: { type: [integer, 'null'] }
                    members: { type: [integer, 'null'], description: 'Member limit; null is unlimited (TL-418).' }
                    price:
                      type: [object, 'null']
                      properties:
                        amount: { type: integer }
                        currency: { type: string }
                        interval: { type: string }

  /subscription/portal:
    post:
      tags: [Billing]
      operationId: createBillingPortalSession
      summary: Create a Stripe billing portal session for the active organization
      responses:
        '200':
          description: Stripe Billing Portal URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/URLResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not a signed-in admin of the active organization. }
        '409': { description: The organization has no Stripe subscription (free, or granted by hand). }
        '503': { description: Billing is not configured or unavailable. }
        '502': { description: Stripe is unavailable. }

  /webhooks/stripe:
    post:
      tags: [Billing]
      operationId: stripeWebhook
      summary: Receive a Stripe webhook event
      description: Authenticates the raw payload with Stripe-Signature. The handler is mounted at this path both under /api and at the API root.
      servers:
        - url: https://tracklin.es/api
        - url: http://localhost:8080/api
        - url: http://localhost:8080
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Event acknowledged. }
        '400': { description: Invalid body or signature. }
        '502': { description: Stripe is unavailable while processing the event. }
        '503': { description: Billing is unavailable. }

  /webhooks/clerk:
    post:
      tags: [Organizations]
      operationId: clerkWebhook
      summary: Receive a Clerk webhook event (delivered by Svix)
      description: >-
        Authenticates the raw payload with the Svix headers and CLERK_WEBHOOK_SECRET (timestamps more than 5 minutes off are rejected).
        organizationMembership.deleted removes the user's admin and team rows in that org and revokes their API keys for it;
        user.deleted does the same across every org; organization.deleted removes the org's admins and teams and revokes its API keys
        (projects, boards and tickets are kept). Other event types are acknowledged and ignored. Safe to replay.
      security: []
      parameters:
        - { name: svix-id, in: header, required: true, schema: { type: string } }
        - { name: svix-timestamp, in: header, required: true, schema: { type: string }, description: Unix seconds. }
        - { name: svix-signature, in: header, required: true, schema: { type: string }, description: 'Space-separated "v1,<base64>" signatures.' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: Event applied or ignored. }
        '400': { description: Invalid body or signature. }
        '503': { description: CLERK_WEBHOOK_SECRET is not set, or the database is unavailable (Svix retries). }

  /health:
    get:
      tags: [System]
      operationId: healthCheck
      summary: Check API and backing services health
      servers:
        - url: http://localhost:8080
          description: Use the deployed backend origin directly in production; the frontend API proxy does not expose /health.
      security: []
      responses:
        '200':
          description: API, PostgreSQL, and Valkey are healthy.
          content:
            text/plain:
              schema: { type: string, example: ok }
        '503': { description: Database or Valkey is unavailable. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or TrackLin.es API key
      description: Clerk session token, TrackLin.es key (`tl_ai_…`, `tl_s_…`, or an older `tl_…`), or BugFixes `bf_` key, depending on the route.
    bugfixesBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: TrackLin.es API key created for a BugFixes agent; key starts with `bf_`.
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A signed-in Clerk session token. API keys are rejected on API-key management routes.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    EpicProgress:
      type: object
      description: "An epic's progress and size, from its direct sub-tickets (duplicates left out)."
      properties:
        done: { type: integer }
        total: { type: integer }
        points: { type: number, description: Sum of their estimates as points (T-shirt sizes converted). }
        unestimated: { type: integer }
    OrganizationMember:
      type: object
      required: [user_id, identifier]
      properties:
        user_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        image_url: { type: string, format: uri }
        identifier: { type: string, description: "Public identifier provided by Clerk, usually an email address." }
    OrganizationMemberPage:
      type: object
      required: [members, total_count, limit, offset]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/OrganizationMember' }
        total_count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    OrgAdmin:
      type: object
      properties:
        user_id: { type: string }
        granted_by: { type: string, description: "clerk:creator, clerk:admin-role, clerk:earliest-member, or the user id of the admin who granted it" }
        created_at: { type: string, format: date-time }
    InvitationInput:
      type: object
      required: [email_address, scope]
      properties:
        email_address: { type: string, format: email }
        scope: { type: string, enum: [organization, team, project] }
        target_id: { type: string, format: uuid, description: Required for team and project scopes; omit for organization scope. }
    Invitation:
      type: object
      required: [id, org_id, email_address, scope, invited_by, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid, description: "TrackLin.es invitation id used by inspect, revoke, and accept routes." }
        org_id: { type: string }
        email_address: { type: string, format: email }
        scope: { type: string, enum: [organization, team, project] }
        target_id: { type: string, format: uuid }
        invited_by: { type: string }
        accept_url: { type: string, format: uri, description: "Clerk-hosted invitation URL, returned by create and list/get." }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        accepted_by: { type: string }
        accepted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    TeamMember:
      type: object
      properties:
        user_id: { type: string }
        leader: { type: boolean }
    Team:
      type: object
      required: [id, org_id, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        key_prefix: { type: string, pattern: '^[A-Z][A-Z0-9]{1,5}$', description: "Update only; lower case is upper-cased. Omitted = unchanged." }
    BoardInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        template_id: { type: string, description: "A template from GET /board-templates (built-in ids start with builtin:). Default builtin:simple (To do, In progress, Done). Unknown id: 400." }
    BoardTemplate:
      type: object
      required: [id, name, builtin, style, estimate_scale, columns]
      properties:
        id: { type: string, description: "builtin:simple, builtin:scrum, builtin:kanban, or an org template's UUID" }
        name: { type: string }
        builtin: { type: boolean }
        style: { type: string, enum: [sprints, kanban] }
        estimate_scale: { $ref: '#/components/schemas/EstimateScale' }
        columns:
          type: array
          minItems: 1
          maxItems: 20
          description: In board order; the last column is Done.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 80 }
              wip_limit: { type: [integer, 'null'], minimum: 1, maximum: 999 }
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    Labels:
      type: array
      maxItems: 20
      items: { type: string, maxLength: 50 }
      description: Free-form labels. Trimmed; blanks and case-insensitive duplicates dropped (first spelling wins). Omit to leave unchanged; [] clears.
    EstimateScale:
      type: string
      enum: [none, fibonacci, tshirt, powers, linear]
      description: 'How a board estimates tickets. fibonacci 1,2,3,5,8,13,21; tshirt XS,S,M,L,XL; powers 1,2,4,8,16; linear 1-5; none turns estimates off.'
    TicketInput:
      type: object
      required: [title]
      properties:
        type:
          type: string
          enum: [bug, feature, task, epic]
          default: task
        title: { type: string, minLength: 1 }
        description: { type: string }
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        labels: { $ref: '#/components/schemas/Labels' }
        estimate:
          type: string
          description: >-
            A value on the board's estimate_scale (400 otherwise). Required when creating on a board with an estimate scale;
            omitted = unchanged on update, and it can't be cleared there. Not allowed on backlog tickets.
    CreateBugfixTicket:
      type: object
      required: [board_id, column_id, title]
      properties:
        board_id:
          type: string
          format: uuid
        column_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        body:
          type: string
          description: Initial ticket description.
        priority:
          type: string
          description: Defaults to medium.
          enum: [low, medium, high, urgent]
        labels: { $ref: '#/components/schemas/Labels' }
    CreateBacklogTicket:
      type: object
      required: [title]
      properties:
        type:
          type: string
          enum: [bug, feature, task, epic]
          default: task
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        labels: { $ref: '#/components/schemas/Labels' }
    Project:
      type: object
      required: [id, name, description, key_prefix, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        key_prefix: { type: string, example: TL, description: "Ticket keys are <key_prefix>-<number>. Worked out from the name on create (its capitals, e.g. TrackLin.es → TL), unique in the org." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        boards:
          type: array
          items: { $ref: '#/components/schemas/BoardSummary' }
        roadmaps:
          type: array
          items: { $ref: '#/components/schemas/Roadmap' }
        stats:
          description: Only on the project list. Open and done count board tickets (done = in the board's last column); urgent counts open urgent tickets on boards or in the backlog.
          type: object
          properties:
            boards: { type: integer }
            roadmaps: { type: integer }
            open: { type: integer }
            done: { type: integer }
            backlog: { type: integer }
            urgent: { type: integer }
            active: { type: string, format: date-time, description: "Latest ticket change, or the project's own update" }
    BoardSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        owner_clerk_id: { type: string }
        name: { type: string }
        description: { type: string }
        estimate_scale: { $ref: '#/components/schemas/EstimateScale' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        team_id: { type: [string, 'null'], format: uuid }
        stats:
          description: Only on a project's boards. Counts the tickets the board shows (the open sprint's, or all if it has never run one). in_progress = neither the first column nor done; urgent = open urgent tickets.
          type: object
          properties:
            open: { type: integer }
            in_progress: { type: integer }
            done: { type: integer }
            urgent: { type: integer }
            active: { type: string, format: date-time, description: "Latest ticket change, or the board's own update" }
            sprint_number: { type: [integer, 'null'] }
            sprint_ends_at: { type: [string, 'null'], format: date-time }
    Ticket:
      type: object
      description: Agent origin is recorded in created_by and rendered in the ticket UI; assignment is shown in assigned_to.
      required: [id, project_id, column_id, title, description, created_by, type, priority, position, blocked]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        column_id: { type: [string, 'null'], format: uuid, description: Null while in the backlog. }
        sprint_id: { type: [string, 'null'], format: uuid }
        type: { type: string, enum: [bug, feature, task, epic] }
        title: { type: string }
        description: { type: string }
        created_by: { type: string }
        assigned_to: { type: [string, 'null'] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        estimate: { type: [string, 'null'], description: "On the board's estimate_scale. Cleared when the ticket moves to the backlog or to a board with another scale." }
        position: { type: integer }
        blocked: { type: boolean }
        labels: { type: array, items: { type: string }, description: 'Free-form labels, sorted case-insensitively.' }
        resolved_at: { type: [string, 'null'], format: date-time, description: "Set when the ticket was resolved in the backlog (POST /tickets/{id}/resolve); it then counts as done." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        done_at: { type: [string, 'null'], format: date-time, description: "When it reached its board's Done column or was resolved; null while open." }
        started_at: { type: [string, 'null'], format: date-time, description: "First move out of the board's first column; null for historical tickets without a known start." }
        planned_sprint_id: { type: [string, 'null'], format: uuid, description: A backlog ticket planned into a board's upcoming sprint (refinement). }
        key: { type: string, example: TL-123, description: "The project's key prefix and the ticket's number in the project, assigned on create. For branch names, PR titles and search." }
        external_source: { type: [string, 'null'], description: Where an integration made it (bugfixes); null for our own tickets. }
        external_url: { type: [string, 'null'], description: Link to it there (e.g. the Bugfixes report). }
        resolution: { type: [string, 'null'], enum: [done, wont_do, duplicate, null], description: "How a resolved backlog ticket was closed." }
        duplicate_of_id: { type: [string, 'null'], format: uuid, description: The original ticket when this ticket is marked as a duplicate. }
        duplicate_of_key: { type: [string, 'null'], description: Key of the original ticket. }
        duplicate_of_title: { type: [string, 'null'], description: Title of the original ticket. }
        review_requested_at: { type: [string, 'null'], format: date-time, description: "Set while an agent's finished ticket waits for a person's review (in the column before Done)." }
    Column:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        wip_limit: { type: [integer, 'null'] }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
    Velocity:
      type: object
      required: [unit, sprints, current]
      properties:
        unit: { type: string, enum: [points, tickets] }
        cap: { type: number, nullable: true, description: "A sprint's capacity: velocity (last 3 closed sprints) + 10%. Null without closed sprints." }
        sprints:
          type: array
          description: Closed sprints, oldest first.
          items:
            type: object
            properties:
              number: { type: integer }
              starts_at: { type: string, format: date-time }
              closed_at: { type: string, format: date-time }
              completed: { type: number }
              planned: { type: [number, 'null'], description: "What the sprint held when it closed (its burn chart scope), in the same unit; null for sprints closed before that was recorded." }
        current:
          description: The open sprint, or null. total is the sprint's current scope (scope changes aren't tracked over time).
          type: [object, 'null']
          properties:
            number: { type: integer }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            total: { type: number }
            unestimated: { type: integer, description: Tickets with no estimate on a points board. }
            done:
              type: array
              description: When each done ticket reached Done, oldest first.
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  value: { type: number }
    BoardFlow:
      type: object
      required: [weeks, tickets, median_cycle_days, p85_cycle_days, throughput]
      properties:
        weeks: { type: integer, description: Number of UTC calendar weeks included, including the current week. }
        tickets:
          type: array
          description: Finished tickets in the date window, oldest completion first.
          items:
            type: object
            required: [id, key, title, started_at, done_at, cycle_days]
            properties:
              id: { type: string, format: uuid }
              key: { type: string, example: TL-123 }
              title: { type: string }
              started_at: { type: [string, 'null'], format: date-time }
              done_at: { type: string, format: date-time }
              cycle_days: { type: [number, 'null'], description: Elapsed days from started_at to done_at; null when start is unknown. }
        median_cycle_days: { type: [number, 'null'], description: Median elapsed days for tickets with a known start. }
        p85_cycle_days: { type: [number, 'null'], description: 85th percentile elapsed days for tickets with a known start. }
        throughput:
          type: array
          description: Counts by UTC Monday week start, including weeks with no completed tickets.
          items:
            type: object
            required: [week_start, tickets]
            properties:
              week_start: { type: string, format: date }
              tickets: { type: integer }
    ProjectRepo:
      type: object
      properties:
        provider: { type: string, enum: [github, bitbucket] }
        full_name: { type: string, example: acme/shop }
        default_branch: { type: string }
        created_at: { type: string, format: date-time }
    ExternalRef:
      type: [object, 'null']
      required: [source, project, id]
      properties:
        source: { type: string, enum: [bugfixes] }
        project: { type: string, description: "The source's project id." }
        id: { type: string, description: e.g. the Bugfixes report id. }
        url: { type: string, format: uri }
    PlannedSprint:
      type: object
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        position: { type: integer, description: 1 = the next sprint }
        number: { type: integer, description: The sprint number it will get }
        length_days: { type: integer }
        goal: { type: string, maxLength: 200, description: Carried into the sprint when it starts. }
        tickets: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
        capacity:
          type: object
          properties:
            unit: { type: string, enum: [points, tickets] }
            velocity: { type: [number, 'null'], description: Average completed over the last 3 closed sprints; null without history. }
            cap: { type: [number, 'null'], description: velocity + 10%; null = no limit yet. }
            used: { type: number }
            unestimated: { type: integer }
            over: { type: boolean }
            approved_total: { type: [number, 'null'] }
            approved_by: { type: [string, 'null'] }
            approved_at: { type: [string, 'null'], format: date-time }
            needs_approval: { type: boolean, description: Over capacity and not covered by an approval; it won't start until approved or trimmed. }
    HostedFocus:
      type: object
      description: What the host has open, shown to followers.
      properties:
        ticketId: { type: string, nullable: true, description: The ticket open; null when none. }
        filters: { type: object, additionalProperties: { type: array, items: { type: string } }, description: e.g. labels, priorities, assignee. }
    HostedSession:
      type: object
      properties:
        host: { type: string, description: The host's user id. }
        startedAt: { type: integer, format: int64, description: Unix milliseconds. }
        focus: { $ref: '#/components/schemas/HostedFocus' }
        people: { type: array, items: { type: string }, description: User ids in the session now (seen in the last minute), host included. }
    LiveStandup:
      type: object
      required: [people, index, spentMs, runningSince, startedBy]
      properties:
        people:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        index: { type: integer, description: Current participant; people.length is the clean-board review. }
        spentMs: { type: integer, format: int64, description: Elapsed time before the current run. }
        runningSince: { type: [integer, 'null'], format: int64, description: Unix milliseconds when the clock resumed; null while paused. }
        startedBy: { type: string }
    Sprint:
      type: object
      properties:
        goal: { type: string, maxLength: 200, description: 'One line the sprint is for; empty = none.' }
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        number: { type: integer }
        length_days: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
    BugfixTicket:
      type: object
      required: [id, board_id, column_id, title, body, priority, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        board_id:
          type: string
          format: uuid
        column_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        priority:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    CreateComment:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        parent_comment_id:
          type: [string, 'null']
          format: uuid
          description: Omit or set null for a top-level appended update; set to a comment ID to reply in a thread.
    Comment:
      type: object
      required: [id, ticket_id, body, author, created_at]
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        parent_comment_id:
          type: [string, 'null']
          format: uuid
        body:
          type: string
        author:
          type: string
          description: BugFixes API key name.
        created_at:
          type: string
          format: date-time
    MoveTicket:
      type: object
      required: [column_id]
      properties:
        column_id:
          type: string
          format: uuid
        position:
          type: integer
          default: 0
        estimate:
          type: string
          description: >-
            Size the ticket on the way in, on the target board's estimate_scale. Required when the ticket enters a board
            with an estimate scale (from the backlog or another board) and has no estimate on that same scale; 400 otherwise.
    TicketDetail:
      type: object
      description: Ticket properties plus board, column, sprint, and completion context.
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        created_by: { type: string }
        assigned_to: { type: [string, 'null'] }
        type: { type: string, enum: [bug, feature, task, epic] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        board_id: { type: [string, 'null'], format: uuid }
        board_name: { type: [string, 'null'] }
        estimate: { type: [string, 'null'] }
        estimate_scale: { $ref: '#/components/schemas/EstimateScale' }
        column_id: { type: [string, 'null'], format: uuid }
        column_name: { type: [string, 'null'] }
        done: { type: boolean }
        attachment_count: { type: integer, description: 'Files on the ticket (list them with GET /tickets/{ticketId}/attachments): designs, screenshots, logs.' }
        blocked_by:
          type: array
          items: { $ref: '#/components/schemas/TicketDependency' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/TicketDependency' }
        parent_id: { type: [string, 'null'], format: uuid }
        children:
          type: array
          items: { $ref: '#/components/schemas/TicketChild' }
        sprint_id: { type: [string, 'null'], format: uuid }
        position: { type: integer }
        blocked: { type: boolean }
        resolution: { type: [string, 'null'], enum: [done, wont_do, duplicate, null] }
        duplicate_of_id: { type: [string, 'null'], format: uuid }
        duplicate_of_key: { type: [string, 'null'] }
        duplicate_of_title: { type: [string, 'null'] }
        epic_id: { type: [string, 'null'], description: "The epic this ticket is part of, at any depth (epics don't nest)." }
        epic: { $ref: '#/components/schemas/EpicProgress' }
        duplicates:
          type: array
          items:
            type: object
            required: [id, key, title]
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              title: { type: string }
        sprint_number: { type: [integer, 'null'] }
    TicketDependency:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        done: { type: boolean }
    TicketChild:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        done: { type: boolean }
        type: { type: string, enum: [bug, feature, task, epic] }
        assigned_to: { type: [string, 'null'] }
        key: { type: [string, 'null'] }
        estimate: { type: [string, 'null'] }
        board_id: { type: [string, 'null'], description: Null when the sub-ticket is in the backlog. }
        board_name: { type: [string, 'null'] }
    AttachmentInput:
      type: object
      required: [key, url, name]
      properties:
        key: { type: string }
        url: { type: string, format: uri, description: Must be an https UploadThing URL on utfs.io or a *.ufs.sh host. }
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 0 }
        content_type: { type: string }
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        key: { type: string }
        url: { type: string, format: uri }
        name: { type: string }
        size: { type: integer }
        content_type: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        delete_on: { type: string, format: date, description: 'Set once the file is a year old: the day it is deleted unless kept.' }
    RoadmapInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        visibility:
          type: string
          enum: [public, login_only, team]
          default: public
    RoadmapItemInput:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid, description: Omit to create a new item. }
        title: { type: string, minLength: 1 }
        description: { type: string }
        start_date: { type: [string, 'null'], format: date, description: Gantt bar start date. }
        target_date: { type: [string, 'null'], format: date }
        manual_status: { type: string, enum: [not_started, in_progress, done] }
    RoadmapUpdateInput:
      type: object
      required: [health, note]
      properties:
        health: { type: string, enum: [on_track, at_risk, off_track] }
        note: { type: string, minLength: 1, maxLength: 2000, description: Plain text or Markdown; rendered as safe text by clients. }
    ReportRollup:
      type: object
      properties:
        id: { type: string, description: The project; absent for the organization. }
        name: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        boards: { type: array, description: "A project's sprint boards (not kanban or archived): each a board report.", items: { type: object } }
        projects: { type: array, description: "The organization's projects, each a roll-up without its boards.", items: { $ref: '#/components/schemas/ReportRollup' } }
        points: { oneOf: [{ $ref: '#/components/schemas/ReportTotals' }, { type: 'null' }], description: Boards that estimate. }
        tickets: { oneOf: [{ $ref: '#/components/schemas/ReportTotals' }, { type: 'null' }], description: Boards that count tickets. }
        overall: { $ref: '#/components/schemas/ReportOverall' }
        previous: { $ref: '#/components/schemas/ReportOverall' }
        months:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: 2026-08 }
              sprints: { type: integer }
              predictability: { type: [number, 'null'] }
              points_done: { type: number }
              tickets_done: { type: number }
        summary: { type: string }
    ReportOverall:
      type: object
      properties:
        sprints: { type: integer }
        predictability: { type: [number, 'null'] }
        goals_set: { type: integer }
        goals_met: { type: integer }
    ReportMix:
      type: object
      properties:
        type: { type: string, enum: [bug, feature, task, epic] }
        count: { type: integer }
        value: { type: number }
    ReportTotals:
      type: object
      properties:
        sprints: { type: integer, description: Closed sprints counted. }
        planned: { type: number }
        done: { type: number }
        predictability: { type: [number, 'null'] }
        added: { type: [number, 'null'] }
        carried: { type: [number, 'null'] }
        velocity: { type: [number, 'null'] }
        mix: { type: array, items: { $ref: '#/components/schemas/ReportMix' } }
    RoadmapUpdate:
      type: object
      required: [id, health, note, published_at]
      properties:
        id: { type: string, format: uuid }
        health: { type: string, enum: [on_track, at_risk, off_track] }
        note: { type: string, maxLength: 2000 }
        published_at: { type: string, format: date-time }
        author:
          type: string
          description: Who posted it, by name (an email-only name without its domain; an agent by its own name). Missing on updates from before TL-413.
    Roadmap:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public, login_only, team] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/Progress' }
        can_manage:
          type: boolean
          description: The caller can change this roadmap (an org admin, or a leader of a team with a board in its project). Always false for readers outside its organization.
        items:
          type: array
          items: { $ref: '#/components/schemas/RoadmapItem' }
    RoadmapItem:
      allOf:
        - $ref: '#/components/schemas/RoadmapItemInput'
        - type: object
          properties:
            position: { type: integer }
            status: { type: string, enum: [not_started, in_progress, done] }
            progress: { $ref: '#/components/schemas/Progress' }
            tickets:
              type: array
              description: Included for the owner; hidden for other viewers.
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  done: { type: boolean }
                  type: { type: string, enum: [bug, feature, task, epic], description: "An epic counts its sub-tickets towards progress." }
    Progress:
      type: object
      properties:
        done: { type: integer }
        total: { type: integer }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 'The id its work is recorded under. Generated for AI keys (e.g. claude-482193); chosen for service keys. Only a label for personal keys, whose work is recorded as their owner.' }
        kind: { type: string, enum: [ai, service, personal], description: AI keys can be assigned tickets; service keys are for servers and integrations; personal keys act exactly as their owner (their own scripts and displays). }
        client: { type: [string, 'null'], enum: [claude-code, claude-desktop, codex, cursor, vscode, gemini, other, null], description: AI keys only. The client the agent runs in. }
        label: { type: [string, 'null'], description: 'AI keys with client "other": what the agent is called.' }
        display: { type: string, description: 'What it is called: "Claude", an other agent''s label (or "AI agent"), or a service key''s name. Others see AI keys with their owner: "Claude (keloran)".' }
        prefix: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time, description: 'After this the key is refused (401 "api key expired").' }
        read_only: { type: boolean, description: 'Only GET, HEAD and OPTIONS; anything else is 403 "this api key is read-only".' }
    CreateApiKeyInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [ai, service, personal] }
        read_only: { type: boolean, default: false, description: The key can only read. }
        client: { type: string, enum: [claude-code, claude-desktop, codex, cursor, vscode, gemini, other], description: Required for AI keys. Their name is generated from it. }
        label: { type: string, maxLength: 40, description: 'AI keys with client "other": what the agent is called (optional).' }
        name: { type: string, description: Required for service and personal keys; ignored for AI keys. }
        expires_in_days: { type: integer, minimum: 1, maximum: 366, default: 90, description: How long the key works. }
    CreatedApiKey:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: Plaintext secret returned only once. }
    URLResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    IntakeSettings:
      type: object
      properties:
        open: { type: boolean }
        token: { type: [string, 'null'], description: 'The form is at /request/{token}.' }
        can_manage: { type: boolean, description: 'The caller may open, close or reset it: a signed-in org admin.' }
    IntakeSubmission:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        type: { type: string, enum: [bug, feature] }
        title: { type: string }
        details: { type: string }
        contact: { type: string }
        status: { type: string, enum: [pending, promoted, dismissed] }
        ticket_id: { type: [string, 'null'], format: uuid }
        ticket_key: { type: [string, 'null'] }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assigned, mention, finished, wont_do, review, sent_back, approval] }
        text: { type: string, description: 'Reads after the actor, e.g. "assigned you TL-12: Fix login".' }
        actor: { type: string, description: User id or agent name. }
        ticket_id: { type: [string, 'null'], format: uuid }
        ticket_key: { type: [string, 'null'] }
        board_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    Board:
      type: object
      required: [id, project_id, name, columns]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        owner_clerk_id: { type: string }
        name: { type: string }
        description: { type: string }
        estimate_scale: { $ref: '#/components/schemas/EstimateScale' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        style: { type: string, enum: [sprints, kanban] }
        agent_review: { type: boolean, description: "Agents' moves into Done wait for a person's review." }
        archived_at: { type: [string, 'null'], format: date-time, description: Archived boards are off the project page and take no new work. }
        deletable: { type: boolean, description: 'Never used (no tickets, no sprints): DELETE works; otherwise archive it.' }
        hidden_done: { type: integer, description: "Kanban only. Done tickets finished more than 14 days ago, left off the board." }
        team_id: { type: [string, 'null'], format: uuid, description: The team whose leaders run this board. }
        sprint: { $ref: '#/components/schemas/Sprint' }
        columns:
          type: array
          items: { $ref: '#/components/schemas/Column' }
    Error:
      type: string
      description: Plain-text error message.
  responses:
    BadRequest:
      description: Invalid request body or field values.
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or revoked API key.
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found or not owned by this API key.
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error.
      content:
        text/plain:
          schema: { $ref: '#/components/schemas/Error' }
