name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      # DB tests start their own PostgreSQL/Valkey containers (internal/testdb, Testcontainers) on the runner's Docker
      - run: go test ./...
