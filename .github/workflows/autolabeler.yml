name: Auto Label

# Labels pull requests from their title or branch, for the draft release's sections and next version
# (rules: .github/release-drafter.yml).
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  auto_label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
